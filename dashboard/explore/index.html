<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRIME — Garbage River Interception and Modeling Engine</title>
<link rel="icon" type="image/png" href="https://grime.world/dashboard/images/favicon.png">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#1E1B12; --panel: #2A2518; --card:  #352E1E; --hover: #3D3622; --bdr: #4A4330; --t:#e8e2d4; --td:  #8a7f68; --tb:    #f5f0e4; --acc:   #58B09C; --accd:  rgba(88, 176, 156, 0.15); --gen:   #f97316; --flow:  #3b82f6; --imp:   #8b5cf6; --feas:  #10b981; --mono:  'JetBrains Mono', monospace; --sans:  'DM Sans', -apple-system, sans-serif; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--t)}

/* ── LAYOUT: header on top, sidebar+map below ── */
#app{display:flex;flex-direction:column;height:100vh;visibility:hidden}
#app.ready{visibility:visible}
#header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--bdr);z-index:10}
#header h1{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--tb)}
#header h1 span{color:var(--acc)}
.hm{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--td);font-family:var(--mono)}
.hm button{background:rgba(255,255,255,0.08);border:1px solid var(--bdr);color:var(--td);padding:3px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--mono)}
.hm button:hover{background:rgba(255,255,255,0.15);color:var(--t)}
#content{flex:1 1 0;display:flex;min-height:0}
#sidebar{width:380px;flex:0 0 380px;background:var(--panel);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.sec{padding:14px 18px;border-bottom:1px solid var(--bdr);flex:0 0 auto}
.sec h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--td);margin-bottom:10px}
#search{width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;color:var(--t);font-family:var(--sans);font-size:13px;outline:none}
#search:focus{border-color:var(--acc)}
#search::placeholder{color:var(--td)}
.stat-row{display:flex;gap:8px;margin:10px 0}
.stat{flex:1;background:var(--card);border-radius:6px;padding:8px 10px;text-align:center}
.stat-v{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--acc)}
.stat-l{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--td)}
#place-list{flex:1 1 0;overflow-y:auto;padding:0 18px 14px;min-height:0}
.pl-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .12s;margin-bottom:2px}
.pl-item:hover{background:var(--hover)}
.pl-cc{font-size:14px;width:28px;text-align:center}
.pl-name{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-pop{font-family:var(--mono);font-size:11px;color:var(--td)}
#back-btn{display:none;background:var(--card);border:1px solid var(--bdr);color:var(--acc);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--mono);margin-bottom:10px}
#back-btn:hover{background:var(--hover)}
#back-btn.vis{display:inline-flex;align-items:center;gap:6px}
#city-view{display:none;flex:1 1 0;overflow-y:auto;padding:14px 18px}
#city-view.vis{display:block}
.cand-item{display:grid;grid-template-columns:32px 1fr 48px;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.cand-item:hover{background:var(--hover)}
.cand-item.active{background:var(--accd)}
.rank{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:11px;background:var(--card);color:var(--td);border:1px solid var(--bdr)}
.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a;border:none}
.r2{background:linear-gradient(135deg,#94a3b8,#64748b);color:#1a1a1a;border:none}
.r3{background:linear-gradient(135deg,#d97706,#b45309);color:#1a1a1a;border:none}
.ss-row{display:grid;grid-template-columns:85px 1fr 42px;align-items:center;gap:6px;margin-bottom:5px}
.ss-bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.ss-fill{height:100%;border-radius:3px;transition:width .4s ease}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:12px}
.pchip{background:var(--card);border:1px solid var(--bdr);border-radius:6px;padding:4px 8px}
.pchip-l{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:var(--td)}
.pchip-v{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--tb)}
.close{background:var(--card);border:1px solid var(--bdr);color:var(--td);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.close:hover{background:var(--hover);color:var(--t)}
.site-detail{position:absolute;top:16px;left:16px;width:min(340px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:rgba(42,37,24,.94);border:1px solid var(--bdr);border-radius:8px;padding:14px 16px;box-shadow:0 16px 44px rgba(0,0,0,.42);z-index:4;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-18px);backdrop-filter:blur(8px);transition:opacity .44s ease,transform .44s ease,visibility 0s linear .44s}
.site-detail.vis{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0);transition:opacity .48s ease,transform .48s ease,visibility 0s}
.site-detail::-webkit-scrollbar{width:5px}
.site-detail::-webkit-scrollbar-track{background:transparent}
.site-detail::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}

/* ── MAP: fill remaining space ── */
#map-wrap{flex:1 1 0;position:relative;min-width:0}
#map{position:absolute;top:0;left:0;right:0;bottom:0}

.mapboxgl-popup-content{background:var(--panel)!important;border:1px solid var(--bdr)!important;border-radius:10px!important;padding:10px 14px!important;color:var(--t)!important;font-family:var(--sans)!important;box-shadow:0 8px 32px rgba(0,0,0,.5)!important}
.mapboxgl-popup-tip{border-top-color:var(--panel)!important}
.mapboxgl-popup-close-button{color:var(--td)!important;font-size:16px!important}
#sidebar::-webkit-scrollbar,#place-list::-webkit-scrollbar,#city-view::-webkit-scrollbar{width:5px}
#sidebar::-webkit-scrollbar-track,#place-list::-webkit-scrollbar-track,#city-view::-webkit-scrollbar-track{background:transparent}
#sidebar::-webkit-scrollbar-thumb,#place-list::-webkit-scrollbar-thumb,#city-view::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--bdr);border-radius:12px;padding:24px 40px;z-index:100;font-family:var(--mono);text-align:center}
#loading .spinner{width:28px;height:28px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Beige / light theme ── */
body.theme-light { --bg:    #F0EDE6; --panel: #FAF8F4; --card:  #E8E4DC; --hover: #DDD8CE; --bdr:   #C8C2B5; --t:     #2C2A1E; --td:    #7A7264; --tb:    #1A1810; --acc:   #2D8C7A; --accd:  rgba(45, 140, 122, 0.12); --gen:   #c2410c; --flow:  #1d4ed8; --imp:   #7e22ce; --feas:  #15803d; --mono:  'JetBrains Mono', monospace; --sans:  'DM Sans', -apple-system, sans-serif; }
body.theme-light .hm button{background:rgba(0,0,0,0.04);border-color:var(--bdr);color:var(--td)}
body.theme-light .hm button:hover{background:rgba(0,0,0,0.08);color:var(--t)}
body.theme-light .hm button.active{background:var(--accd);color:var(--acc);border-color:var(--acc)}
body.theme-light .mapboxgl-popup-content{background:var(--panel)!important;border-color:var(--bdr)!important;color:var(--t)!important}
body.theme-light .mapboxgl-popup-tip{border-top-color:var(--panel)!important}
body.theme-light #loading{background:var(--panel);border-color:var(--bdr);color:var(--t)}
body.theme-light .site-detail{background:rgba(250,248,244,.95);box-shadow:0 16px 44px rgba(44,42,30,.18)}
body.theme-light .r1{background:linear-gradient(135deg,#d4a017,#b8860b);color:#fff}
body.theme-light .r2{background:linear-gradient(135deg,#a8a29e,#78716c);color:#fff}
body.theme-light .r3{background:linear-gradient(135deg,#b45309,#92400e);color:#fff}
.hm button.active{background:var(--accd)!important;color:var(--acc)!important;border-color:rgba(34,211,238,0.3)!important}
body.theme-light .hm button.active{border-color:var(--acc)!important}

/* ── Pan-autoload "loading more streams" pill (top-right of map) ── */
#load-pill{position:absolute;top:12px;right:60px;background:var(--panel);border:1px solid var(--bdr);border-radius:18px;padding:6px 12px;font-family:var(--mono);font-size:11px;color:var(--td);display:none;align-items:center;gap:8px;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none}
#load-pill.vis{display:flex}
#load-pill .mini-spinner{width:12px;height:12px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}

/* ── River-focus back chip in sidebar ── */
.river-back{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bdr);color:var(--acc);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--mono);margin-bottom:10px}
.river-back:hover{background:var(--hover)}
@media(max-width:760px){
  #content{flex-direction:column}
  #sidebar{width:100%;flex:0 0 42vh;border-right:none;border-bottom:1px solid var(--bdr)}
  .site-detail{top:auto;bottom:12px;left:12px;width:calc(100% - 24px);max-height:45vh}
}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div id="load-msg">Loading GRIME — 89,518 places...</div></div>
<div id="app">
<div id="header">
  <h1><a href="../" style="text-decoration:none;color:inherit"><span>G</span>RIME</a></h1>
  <div class="hm">
    <span id="info">—</span>
    <a href="../docs/" style="font-family:var(--mono);font-size:11px;color:var(--td);text-decoration:none;letter-spacing:.04em;padding:3px 10px;border:1px solid var(--bdr);border-radius:6px;transition:all .15s" onmouseover="this.style.color=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();this.style.borderColor=this.style.color" onmouseout="this.style.color='';this.style.borderColor=''">Docs</a>
    <button id="ww-toggle" title="Toggle OpenStreetMap waterway overlay">Waterways</button>
    <button id="style-toggle" class="active">Satellite ✓</button>
    <button id="theme-toggle">Light theme</button>
    <span style="color:var(--feas)">● v3</span>
  </div>
</div>
<div id="content">
  <div id="sidebar">
    <div class="sec">
      <button id="back-btn">← All cities</button>
      <h3 id="sidebar-title">Global coverage</h3>
      <input type="text" id="search" placeholder="Search cities, countries..." autocomplete="off">
      <div class="stat-row" id="stats"></div>
    </div>
    <div id="place-list"></div>
    <div id="city-view"></div>
  </div>
  <div id="map-wrap"><div id="map"></div><div id="site-detail" class="site-detail"></div><div id="load-pill"><div class="mini-spinner"></div><span id="load-pill-text">Loading more streams…</span></div></div>
</div>
</div>
<script src="dashboard/config.js"></script>
<script>
// ═══ CONFIG ══════════════════════════════════════════════════════
const API=location.hostname==='localhost'?'http://localhost:8000':location.origin;

// Resolve the Mapbox token. Prefers a local config.js global (dev convenience);
// otherwise fetches it from the API's /api/config, which reads the MAPBOX_TOKEN
// env var. config.js is gitignored, so deployments rely on the env var path.
async function getMapboxToken(){
  if(typeof MAPBOX_TOKEN!=='undefined' && MAPBOX_TOKEN && !MAPBOX_TOKEN.includes('YOUR_MAPBOX')) return MAPBOX_TOKEN;
  try{
    const r=await fetch(API+'/api/config');
    if(r.ok){const j=await r.json(); if(j.mapbox_token) return j.mapbox_token;}
  }catch(e){}
  return '';
}

// ═══ STATE ══════════════════════════════════════════════════════
let map,places=[],activeCityIdx=-1,activeCandidates=[],activeStreams=[],selectedCand=null,isSat=true,pipelineStats=null;
// Precomputed real-pipeline regions (mock_data/regions/): when the opened city
// falls inside a scored region's bbox, its REAL scored sites are shown instead
// of client-side generation. Cities outside every region keep the exact
// existing behavior. activeRegionSlug is non-null only while such a city is open.
let regionsIndex=null,regionsIndexTried=false,regionCandCache={},activeRegionSlug=null,regionLatBuckets=null;
// True while the open region city renders BAKED waterway geometry (the `streams`
// FeatureCollection baked into the region file by scripts/add_river_names.py).
// When set, the explorer has zero live-Overpass dependency: no background river
// fetch, no pan-autoload, no whole-river trace — the baked lines are the rivers.
let hasBakedStreams=false;
// Remember city params so we can re-score after pan-autoload merges in new streams
let activePop=0,activeCC='',activeSeed=0;
// Pan-autoload state
let coveredBboxes=[];      // [[w,s,e,n], ...] bboxes already fetched from Overpass
let streamKeySet=new Set();// dedupe ways already merged into activeStreams (keyed by OSM id or coord hash)
// Draw layer is DECOUPLED from candidate placement: drawStreams holds the FULL fetched
// waterway network (no width/length/cap gates) so a river split across many OSM ways
// renders as one continuous line. activeStreams stays the gated set that feeds candidate
// scoring — so what gets DRAWN changes here, but which nets get SCORED does not.
let drawStreams=[];        // full waterway geometry for rendering only
let drawKeySet=new Set();  // dedupe ways already merged into drawStreams
const MAX_DRAW=12000;      // safety ceiling on rendered ways (perf); never hit in practice
let panFetchInFlight=false,panFetchQueued=false,panDebounceTimer=null,rescoreTimer=null;
let initialFetchInFlight=false; // true while openCity's first Overpass call is running
let lastPanFetchAt=0,rateLimitTimer=null; // hard rate limit between pan-autoload fetches
// Rate-limit: minimum ms between fetch *starts*. Pans during the cooldown queue
// up and the latest viewport fires when the timer expires — so panning never
// drops a load, it just throttles how fast we hammer Overpass.
const PAN_MIN_INTERVAL_MS=1500;
// Substantial-pan gate: require this fraction of the viewport to be uncovered
// before bothering with a fetch. Tiny nudges at the edge of the bubble no
// longer trigger network calls.
const PAN_MIN_UNCOVERED=0.15;
// River focus state
let focusedRiverKey=null,focusedRiverName=null,riverFetchInFlight=false;
const sc=s=>s>=45?'#22d3ee':s>=35?'#10b981':s>=25?'#f59e0b':'#ef4444';
const CC_FLAGS={"AD":"🇦🇩","AE":"🇦🇪","AF":"🇦🇫","AG":"🇦🇬","AL":"🇦🇱","AM":"🇦🇲","AO":"🇦🇴","AR":"🇦🇷","AT":"🇦🇹","AU":"🇦🇺","AZ":"🇦🇿","BA":"🇧🇦","BB":"🇧🇧","BD":"🇧🇩","BE":"🇧🇪","BF":"🇧🇫","BG":"🇧🇬","BH":"🇧🇭","BI":"🇧🇮","BJ":"🇧🇯","BN":"🇧🇳","BO":"🇧🇴","BR":"🇧🇷","BS":"🇧🇸","BT":"🇧🇹","BW":"🇧🇼","BY":"🇧🇾","BZ":"🇧🇿","CA":"🇨🇦","CD":"🇨🇩","CF":"🇨🇫","CG":"🇨🇬","CH":"🇨🇭","CI":"🇨🇮","CL":"🇨🇱","CM":"🇨🇲","CN":"🇨🇳","CO":"🇨🇴","CR":"🇨🇷","CU":"🇨🇺","CV":"🇨🇻","CY":"🇨🇾","CZ":"🇨🇿","DE":"🇩🇪","DJ":"🇩🇯","DK":"🇩🇰","DM":"🇩🇲","DO":"🇩🇴","DZ":"🇩🇿","EC":"🇪🇨","EE":"🇪🇪","EG":"🇪🇬","ER":"🇪🇷","ES":"🇪🇸","ET":"🇪🇹","FI":"🇫🇮","FJ":"🇫🇯","FR":"🇫🇷","GA":"🇬🇦","GB":"🇬🇧","GE":"🇬🇪","GH":"🇬🇭","GM":"🇬🇲","GN":"🇬🇳","GQ":"🇬🇶","GR":"🇬🇷","GT":"🇬🇹","GW":"🇬🇼","GY":"🇬🇾","HK":"🇭🇰","HN":"🇭🇳","HR":"🇭🇷","HT":"🇭🇹","HU":"🇭🇺","ID":"🇮🇩","IE":"🇮🇪","IL":"🇮🇱","IN":"🇮🇳","IQ":"🇮🇶","IR":"🇮🇷","IS":"🇮🇸","IT":"🇮🇹","JM":"🇯🇲","JO":"🇯🇴","JP":"🇯🇵","KE":"🇰🇪","KG":"🇰🇬","KH":"🇰🇭","KM":"🇰🇲","KN":"🇰🇳","KP":"🇰🇵","KR":"🇰🇷","KW":"🇰🇼","KZ":"🇰🇿","LA":"🇱🇦","LB":"🇱🇧","LK":"🇱🇰","LR":"🇱🇷","LS":"🇱🇸","LT":"🇱🇹","LU":"🇱🇺","LV":"🇱🇻","LY":"🇱🇾","MA":"🇲🇦","MD":"🇲🇩","ME":"🇲🇪","MG":"🇲🇬","MK":"🇲🇰","ML":"🇲🇱","MM":"🇲🇲","MN":"🇲🇳","MR":"🇲🇷","MT":"🇲🇹","MU":"🇲🇺","MV":"🇲🇻","MW":"🇲🇼","MX":"🇲🇽","MY":"🇲🇾","MZ":"🇲🇿","NA":"🇳🇦","NE":"🇳🇪","NG":"🇳🇬","NI":"🇳🇮","NL":"🇳🇱","NO":"🇳🇴","NP":"🇳🇵","NZ":"🇳🇿","OM":"🇴🇲","PA":"🇵🇦","PE":"🇵🇪","PG":"🇵🇬","PH":"🇵🇭","PK":"🇵🇰","PL":"🇵🇱","PS":"🇵🇸","PT":"🇵🇹","PY":"🇵🇾","QA":"🇶🇦","RO":"🇷🇴","RS":"🇷🇸","RU":"🇷🇺","RW":"🇷🇼","SA":"🇸🇦","SB":"🇸🇧","SC":"🇸🇨","SD":"🇸🇩","SE":"🇸🇪","SG":"🇸🇬","SI":"🇸🇮","SK":"🇸🇰","SL":"🇸🇱","SM":"🇸🇲","SN":"🇸🇳","SO":"🇸🇴","SR":"🇸🇷","SS":"🇸🇸","SV":"🇸🇻","SY":"🇸🇾","SZ":"🇸🇿","TD":"🇹🇩","TG":"🇹🇬","TH":"🇹🇭","TJ":"🇹🇯","TL":"🇹🇱","TM":"🇹🇲","TN":"🇹🇳","TO":"🇹🇴","TR":"🇹🇷","TT":"🇹🇹","TW":"🇹🇼","TZ":"🇹🇿","UA":"🇺🇦","UG":"🇺🇬","US":"🇺🇸","UY":"🇺🇾","UZ":"🇺🇿","VA":"🇻🇦","VC":"🇻🇨","VE":"🇻🇪","VN":"🇻🇳","VU":"🇻🇺","WS":"🇼🇸","XK":"🇽🇰","YE":"🇾🇪","ZA":"🇿🇦","ZM":"🇿🇲","ZW":"🇿🇼"};
const DEV=new Set(['IN','BD','PK','NG','EG','KE','CD','GH','TZ','ET','CM','SN','MZ','MW','UG','RW','BF','ML','NE','TD','BI','SO','SS','CF','GN','SL','LR','GM','GW','TG','BJ','MG','MR','DJ','KM','ER','BR','CO','PE','BO','PY','GY','SR','EC','VE','MX','GT','HN','SV','NI','HT','ID','PH','MM','KH','LA','VN','TL','PG','CN','MN','KG','TJ','TM','UZ','KZ','AF','IQ','SY','YE','JO','PS','LB','IR']);

// ═══ DATA ═══════════════════════════════════════════════════════
async function loadPlaces(){
  const paths=[API+'/mock_data/places.json','/mock_data/places.json','../../mock_data/places.json','../mock_data/places.json','mock_data/places.json'];
  for(const p of paths){try{const r=await fetch(p);if(r.ok)return await r.json()}catch(e){}}
  return[];
}

// ═══ PRECOMPUTED REGIONS (real pipeline output) ═════════════════
// A 1°-latitude bucket index (regionLatBuckets, declared with the region state
// above) keeps region lookup ~O(1) with hundreds of regions: openCity only tests
// the handful of regions in the point's lat band.
async function loadRegionsIndex(){
  if(regionsIndexTried)return regionsIndex;
  regionsIndexTried=true;
  for(const p of [API+'/api/regions','/api/regions',API+'/mock_data/regions/index.json','/mock_data/regions/index.json']){
    try{
      const r=await fetch(p);
      if(!r.ok)continue;
      const j=await r.json();
      if(j&&Array.isArray(j.regions)){
        // Only regions that were scored AND have at least one site are lookup
        // targets. Zero-candidate towns (a correct result — no deployable urban
        // waterway) are treated exactly like unscored cities.
        regionsIndex=j.regions.filter(x=>x&&typeof x.status==='string'&&x.status.startsWith('ok')&&(x.site_count>0));
        regionLatBuckets={};
        for(const r of regionsIndex){
          const b=r.bbox;
          for(let lb=Math.floor(b[1]);lb<=Math.floor(b[3]);lb++)(regionLatBuckets[lb]=regionLatBuckets[lb]||[]).push(r);
        }
        return regionsIndex;
      }
    }catch(e){}
  }
  regionsIndex=[];regionLatBuckets={};
  return regionsIndex;
}

function regionForPoint(lon,lat){
  if(!regionLatBuckets)return null;
  const bucket=regionLatBuckets[Math.floor(lat)];
  if(!bucket)return null;
  for(const r of bucket){
    const b=r.bbox;
    if(lon>=b[0]&&lon<=b[2]&&lat>=b[1]&&lat<=b[3])return r;
  }
  return null;
}

// Returns the region doc {features, streams} — features are the scored sites,
// streams is the BAKED waterway FeatureCollection (may be absent in older data,
// in which case the caller falls back to the live Overpass fetch).
async function fetchRegionCandidates(slug){
  if(regionCandCache[slug])return regionCandCache[slug];
  for(const p of [API+'/api/regions/'+slug+'/candidates','/api/regions/'+slug+'/candidates',
                  API+'/mock_data/regions/'+slug+'.geojson','/mock_data/regions/'+slug+'.geojson']){
    try{
      const r=await fetch(p);
      if(!r.ok)continue;
      const j=await r.json();
      if(j&&j.features&&j.features.length){
        regionCandCache[slug]={features:j.features,streams:j.streams||null};
        return regionCandCache[slug];
      }
    }catch(e){}
  }
  return null;
}

// Convert the baked `streams` FeatureCollection into drawStreams entries (the
// shape buildStreamLayerGeo consumes). A MultiLineString river becomes several
// entries sharing one riverKey, so it still highlights/focuses as ONE river.
function bakedStreamsToDraw(fc){
  const out=[];
  if(!fc||!fc.features)return out;
  for(const f of fc.features){
    const p=f.properties||{},g=f.geometry||{};
    const parts=g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];
    let i=0;
    for(const coords of parts){
      if(!coords||coords.length<2)continue;
      out.push({osmId:'baked:'+(p.riverKey||p.name||'?')+':'+(i++),name:p.name||'River',
        baseName:p.name||'River',order:p.order||2,coords,estWidth:5,
        waterway:p.waterway||'stream',underground:false,riverKey:p.riverKey||null});
    }
  }
  return out;
}

// Map a real scored feature onto the exact shape the existing rendering reads.
// `river_name` is baked into the region data (scripts/add_river_names.py: nearest
// named OSM waterway ≤300 m), so real river names show instantly without depending
// on the browser's Overpass fetch. The riverKey is derived from that name so sites
// on the same river group together (river-focus) and light up when the OSM rivers
// draw. Sites with no named waterway keep a "Segment N" label.
function regionFeatureToCandidate(f,i){
  const p=f.properties||{};
  const fmt=(v,d)=>(v==null||isNaN(+v))?'—':(+v).toFixed(d);
  const rn=(p.river_name||'').trim();
  return{id:i,lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1],
    stream:rn||('Segment '+(p.segment_id!=null?p.segment_id:i)),streamWidth:+p.channel_width_m||5,
    waterway:'stream',riverKey:rn?rn.toLowerCase():'__region_'+i,upstreamFrac:0,order:p.stream_order||2,
    streamIdx:-1,coordIdx:0,wayOrder:-1,isPortal:false,
    composite:+(+p.composite_score||0).toFixed(1),gen:+(+p.generation_score||0).toFixed(1),
    flow:+(+p.flow_score||0).toFixed(1),impact:+(+p.impact_score||0).toFixed(1),
    feas:+(+p.feasibility_score||0).toFixed(1),
    pop_d:fmt(p.population_density,0),imp_pct:fmt(p.impervious_pct,1),
    vel:fmt(p.flow_velocity_ms,2),mq:fmt(p.usgs_mean_q_cfs,1),
    stream_order:p.stream_order!=null?p.stream_order:'—',catch_km2:fmt(p.catchment_area_km2,1),
    ej:fmt(p.ej_index,2),road_m:fmt(p.road_access_m,0),width_m:fmt(p.channel_width_m,1),
    slope_deg:fmt(p.bank_slope_deg,1)};
}

// ═══ SEEDED RANDOM (for fallback + candidate scoring) ═══════════
function seededRand(seed){
  let s=Math.abs(Math.round(seed))||1;
  return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646};
}

// ═══ HTML ESCAPE (X1 — XSS hardening) ═══════════════════════════
// Third-party strings (OSM way names → c.stream / focusedRiverName, places.json
// names/country codes) flow into innerHTML. An OSM way literally named
// <img src=x onerror=alert(1)> would otherwise execute. Wrap every such string.
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

// Deterministic string → [0,1) hash (FNV-1a). Used to seed a per-candidate RNG
// from the site's own coordinates, so a site's values are identical across
// re-renders (C3 determinism) regardless of how many streams are loaded.
function hash01(str){
  let h=2166136261>>>0;
  const s=String(str);
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return (h>>>0)/4294967296;
}

// ═══ REAL RIVER DATA FROM OPENSTREETMAP ═════════════════════════
const OVERPASS_URLS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];

async function runOverpass(query,abortMs){
  for(const url of OVERPASS_URLS){
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),abortMs);
      const resp=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(query),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctrl.signal});
      clearTimeout(timer);
      if(!resp.ok)continue;
      return await resp.json();
    }catch(e){continue}
  }
  return null;
}

// ── Hard gates applied at parse time ────────────────────────────
// Per-type minimum length (meters): drops backyard drainage / disconnected
// dashes that don't actually route trash anywhere meaningful.
const MIN_LEN_M={river:50,canal:50,stream:120,drain:250,ditch:250};
// Waterway types that get culvert portal candidates injected when they go
// underground. Drains and ditches do not — a road culvert under a ditch is
// not a meaningful interception point and would otherwise dominate top-N.
const PORTAL_PARENTS=new Set(['river','canal','stream']);

// Parse an Overpass JSON response into our streams[] shape with _portals attached.
// Returns null on parse failure / no usable geometry.
function parseStreams(data){
  if(!data) return null;
  const streams=[];
  const portalPoints=[];
  for(const el of data.elements||[]){
    if(!el.geometry||el.geometry.length<2)continue;
    const tags=el.tags||{};
    const wStr=tags.width||tags['width:mean']||'';
    const wM=parseFloat(wStr);
    if(wM&&wM>30)continue;
    const ww=tags.waterway||'stream';
    let estW=ww==='river'?20:ww==='canal'?8:ww==='stream'?3:2;
    if(wM>0)estW=wM;
    if(estW>30)continue;
    // Skip seasonal / dry waterways — except actual rivers, where intermittent
    // flow can still carry a year's accumulated debris during storms.
    if(tags.intermittent==='yes'&&ww!=='river')continue;
    const coords=el.geometry.map(n=>[n.lon,n.lat]);
    // Length gate: real waterways are long; tiny ditches are noise.
    let totalLen=0;
    for(let i=1;i<coords.length;i++)totalLen+=hvM(coords[i-1][1],coords[i-1][0],coords[i][1],coords[i][0]);
    const minLen=MIN_LEN_M[ww]||MIN_LEN_M.stream;
    if(totalLen<minLen)continue;
    const underground=tags.tunnel==='yes'||tags.tunnel==='culvert'||tags.tunnel==='building_passage'||tags.covered==='yes'||tags.layer==='-1'||tags.layer==='-2';
    const baseName=tags.name||({'river':'River','stream':'Creek','canal':'Canal','drain':'Drain','ditch':'Ditch'}[ww])||'Stream';
    const order=ww==='river'?4:ww==='canal'?3:ww==='stream'?2:1;
    if(underground){
      // Only inject portal candidates for meaningful parent waterways. A road
      // culvert under a backyard ditch is not a chokepoint worth surfacing.
      if(coords.length>=2&&PORTAL_PARENTS.has(ww)){
        portalPoints.push({lon:coords[0][0],lat:coords[0][1],type:'entrance',stream:baseName,estWidth:estW,parentWw:ww});
        portalPoints.push({lon:coords[coords.length-1][0],lat:coords[coords.length-1][1],type:'exit',stream:baseName,estWidth:estW,parentWw:ww});
      }
      streams.push({osmId:el.id,name:baseName+' (culvert)',baseName,order,coords,estWidth:estW,waterway:ww,underground:true});
    }else{
      streams.push({osmId:el.id,name:baseName,baseName,order,coords,estWidth:estW,waterway:ww,underground:false});
    }
  }
  streams._portals=portalPoints;
  return streams;
}

// Parse Overpass JSON into the FULL waterway network for RENDERING ONLY. Unlike
// parseStreams(), this applies NONE of the candidate gates — no width drop, no
// per-type length gate, no intermittent skip, no maxStreams cap. A long river is
// often split into many OSM ways (Crabtree Creek = 11 ways, node counts down to 3);
// the cap/length gates drop the short middle reaches and the river renders as
// disconnected fragments. Keeping every fetched way here makes it render continuous.
// Candidate placement still consumes the gated parseStreams()+applyQualityBar() set,
// so this changes only the drawn geometry, never which nets get scored.
function parseStreamsFull(data){
  if(!data)return null;
  const out=[];
  for(const el of data.elements||[]){
    if(!el.geometry||el.geometry.length<2)continue;
    const tags=el.tags||{};
    const ww=tags.waterway||'stream';
    const wM=parseFloat(tags.width||tags['width:mean']||'');
    let estW=ww==='river'?20:ww==='canal'?8:ww==='stream'?3:2;
    if(wM>0)estW=wM;
    const coords=el.geometry.map(n=>[n.lon,n.lat]);
    const underground=tags.tunnel==='yes'||tags.tunnel==='culvert'||tags.tunnel==='building_passage'||tags.covered==='yes'||tags.layer==='-1'||tags.layer==='-2';
    const baseName=tags.name||({'river':'River','stream':'Creek','canal':'Canal','drain':'Drain','ditch':'Ditch'}[ww])||'Stream';
    const order=ww==='river'?4:ww==='canal'?3:ww==='stream'?2:1;
    out.push({osmId:el.id,name:underground?baseName+' (culvert)':baseName,baseName,order,coords,estWidth:estW,waterway:ww,underground});
  }
  return out;
}

// Fetch waterways within an OSM bbox. Returns parseStreams result (gated, for
// candidates) with the full render geometry attached as ._full.
async function fetchStreamsInBbox(s,w,n,e,opts={}){
  const timeout=opts.timeout||10;
  const types=opts.types||'^(river|stream|canal|drain|ditch)$';
  const tidalClause=opts.allowTidal?'':'["tidal"!="yes"]';
  const query=`[out:json][timeout:${timeout}];(way["waterway"~"${types}"]${tidalClause}(${s},${w},${n},${e}););out geom tags;`;
  const data=await runOverpass(query,(timeout+5)*1000);
  const cands=parseStreams(data);
  if(cands)cands._full=parseStreamsFull(data);  // full geometry for the draw layer
  return cands;
}

// Approximate radius (meters) → bbox (degrees) around a point.
function radiusToBbox(lat,lon,radiusMeters){
  const dLat=radiusMeters/111000;
  const dLon=radiusMeters/(111000*Math.max(0.1,Math.cos(lat*Math.PI/180)));
  return{s:lat-dLat,w:lon-dLon,n:lat+dLat,e:lon+dLon};
}

// Per-fetch quality bar — surface-first ordering, sort by length (longest first),
// keep at most `maxStreams` total of which at most `maxCulverts` are underground.
// Used by BOTH the initial city fetch and every pan-autoload fetch so panning
// around can never sneak in low-priority short ditches or stormdrain culverts
// that the initial criteria would have trimmed.
function applyQualityBar(streams,opts={}){
  if(!streams)return streams;
  const maxStreams=opts.maxStreams||25;
  const maxCulverts=opts.maxCulverts??Math.max(2,Math.floor(maxStreams*0.15));
  const portals=streams._portals||[];
  // Sort: surface first, then by length (proxied by number of coords, since
  // OSM ways with more nodes are almost always longer at our resolution).
  streams.sort((a,b)=>(a.underground?1:0)-(b.underground?1:0)||(b.coords.length-a.coords.length));
  const surface=streams.filter(s=>!s.underground).slice(0,maxStreams);
  const culverts=streams.filter(s=>s.underground).slice(0,maxCulverts);
  const out=surface.concat(culverts);
  out._portals=portals;
  return out;
}

// Initial city-anchored fetch: progressive radii + tiny last-resort fallback.
// On success, records the bbox into coveredBboxes and primes streamKeySet for dedup.
async function fetchRealStreams(lat,lon,pop){
  const baseRadius=pop>1e6?8000:pop>100000?6000:4000;
  const radii=[baseRadius,Math.round(baseRadius*0.5),Math.round(baseRadius*0.3)];
  let raw=null,bboxUsed=null;
  for(const radius of radii){
    const bb=radiusToBbox(lat,lon,radius);
    const r=await fetchStreamsInBbox(bb.s,bb.w,bb.n,bb.e,{timeout:radius>5000?12:8});
    if(r){raw=r;bboxUsed=bb;break}
  }
  if(!raw||(raw.length===0&&(!raw._portals||raw._portals.length===0))){
    const miniRadius=Math.round(baseRadius*0.2);
    const bb=radiusToBbox(lat,lon,miniRadius);
    const r=await fetchStreamsInBbox(bb.s,bb.w,bb.n,bb.e,{timeout:6,types:'^(river|stream)$',allowTidal:true});
    if(r){raw=r;bboxUsed=bb}
  }
  if(!raw)return null;
  const portals=raw._portals||[];
  const surface=raw.filter(s=>!s.underground);
  if(surface.length===0&&portals.length===0)return null;
  if(bboxUsed)coveredBboxes.push([bboxUsed.w,bboxUsed.s,bboxUsed.e,bboxUsed.n]);
  if(portals.length>0)console.log(`Found ${portals.length} culvert portals`);

  const draw=raw._full||raw;  // full network for rendering (decoupled from candidate gates)
  const maxStreams=pop>1e6?25:pop>1e5?20:15;
  const sliced=applyQualityBar(raw,{maxStreams});
  for(const s of sliced)streamKeySet.add(streamKey(s));
  return {cands:sliced,draw};
}

// Fetch every named waterway segment within a generous bbox (~3 deg ≈ 300km square).
// The OSM name index makes this query cheap even though the bbox is large.
async function fetchRiverByName(name,lat,lon){
  const bb={s:lat-1.5,w:lon-1.5,n:lat+1.5,e:lon+1.5};
  const safe=name.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  const query=`[out:json][timeout:25];(way["waterway"]["name"="${safe}"](${bb.s},${bb.w},${bb.n},${bb.e}););out geom tags;`;
  const data=await runOverpass(query,30000);
  const cands=parseStreams(data);
  if(cands)cands._full=parseStreamsFull(data);  // full traced-river geometry for the draw layer
  return cands;
}

// Stable identifier for a way — OSM id when present, else a coord-hash fallback.
function streamKey(s){
  if(s.osmId!=null)return'w'+s.osmId;
  const c0=s.coords?.[0]||[0,0],cN=s.coords?.[s.coords.length-1]||[0,0];
  return'h:'+(s.name||'?')+':'+c0[0].toFixed(4)+','+c0[1].toFixed(4)+'>'+cN[0].toFixed(4)+','+cN[1].toFixed(4);
}

// Lowercased "river identity" used to group multiple OSM ways belonging to the same
// named waterway (e.g. all segments of "Anacostia River"). Falls back to a synthetic
// per-way key for unnamed waterways so they at least cluster as themselves.
function riverKeyOf(s){
  // Baked region streams carry an explicit riverKey (matches the sites'
  // river_name.toLowerCase(), even for bare generic names like "Creek").
  if(s.riverKey)return s.riverKey;
  const n=(s.baseName||s.name||'').toLowerCase().replace(/\s*\(culvert\)$/,'').replace(/\s*\((entrance|exit)\)$/,'').trim();
  if(n&&n!=='river'&&n!=='creek'&&n!=='stream'&&n!=='canal'&&n!=='drain'&&n!=='ditch')return n;
  return'__unnamed_'+(s.osmId||streamKey(s));
}

// Merge new streams into activeStreams, deduping by streamKey. Also concatenates _portals.
function mergeStreams(newStreams){
  if(!newStreams||newStreams.length===0&&(!newStreams._portals||newStreams._portals.length===0))return 0;
  let added=0;
  for(const s of newStreams){
    const k=streamKey(s);
    if(streamKeySet.has(k))continue;
    streamKeySet.add(k);
    activeStreams.push(s);
    added++;
  }
  if(newStreams._portals&&newStreams._portals.length){
    activeStreams._portals=(activeStreams._portals||[]).concat(newStreams._portals);
  }
  return added;
}

// Merge new FULL-network ways into drawStreams (render set), deduping by streamKey.
// No quality bar — every distinct way is kept so rivers render continuously. A high
// ceiling guards performance without ever trimming a river mid-reach in practice.
function mergeDraw(fullStreams){
  if(!fullStreams)return 0;
  let added=0,capped=false;
  for(const s of fullStreams){
    if(drawStreams.length>=MAX_DRAW){capped=true;break}
    const k=streamKey(s);
    if(drawKeySet.has(k))continue;
    drawKeySet.add(k);
    drawStreams.push(s);
    added++;
  }
  if(capped)console.warn(`Draw cap ${MAX_DRAW} reached — extra stream geometry not rendered`);
  return added;
}

// ═══ CANDIDATE PLACEMENT ════════════════════════════════════════
// Key insight: a net upstream already catches most debris. Placing another
// net 300m downstream on the SAME stream is wasteful — it only catches
// the ~30% that slipped through. The marginal value drops exponentially
// with each upstream net. So:
//   1. Wide spacing (500m same-stream, 300m cross-stream)
//   2. Score everything independently first
//   3. Greedy selection with upstream occlusion: each time we place a net,
//      discount all un-placed candidates downstream on the same waterway

function hvM(a1,o1,a2,o2){const R=6371000,dA=(a2-a1)*Math.PI/180,dO=(o2-o1)*Math.PI/180;const a=Math.sin(dA/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dO/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}

function waterwayCapacity(stream){
  const ww=stream.waterway||'stream';
  const nCoords=stream.coords?.length||10;
  if(ww==='canal')return Math.max(5,Math.floor(nCoords/3));
  return Math.max(8,Math.floor(nCoords/2));
}

// M7-JS: chain each river's OSM ways head→tail by matching endpoints (≤~60 m) so we
// have a real downstream rank per way. A river is often split into several OSM ways
// returned in arbitrary order, so global creation id / raw coordIdx don't track flow.
// Returns Map: streamArrayIndex → wayOrder (0 = most upstream way of that river).
function computeWayOrder(streams){
  const order=new Map();
  const byRiver={};
  (streams||[]).forEach((s,idx)=>{
    if(s.underground)return;
    const k=riverKeyOf(s);
    (byRiver[k]=byRiver[k]||[]).push({s,idx});
  });
  const near=(a,b)=>a&&b&&hvM(a[1],a[0],b[1],b[0])<=60;
  for(const k in byRiver){
    const ways=byRiver[k];
    if(ways.length===1){order.set(ways[0].idx,0);continue;}
    const heads=ways.map(w=>w.s.coords[0]);
    const tails=ways.map(w=>w.s.coords[w.s.coords.length-1]);
    const nextOf=new Array(ways.length).fill(-1);
    const hasPrev=new Array(ways.length).fill(false);
    for(let i=0;i<ways.length;i++)for(let j=0;j<ways.length;j++){
      if(i!==j&&near(tails[i],heads[j])){nextOf[i]=j;hasPrev[j]=true;}
    }
    const visited=new Array(ways.length).fill(false);
    let next=0;
    for(let i=0;i<ways.length;i++){
      if(hasPrev[i])continue;            // start from headwater ways
      let cur=i,ord=0;
      while(cur!==-1&&!visited[cur]){visited[cur]=true;order.set(ways[cur].idx,ord++);cur=nextOf[cur];}
      next=Math.max(next,ord);
    }
    for(let i=0;i<ways.length;i++)if(!visited[i])order.set(ways[i].idx,next++); // cycles/disconnected
  }
  return order;
}

function generateCandidates(streams,pop,cc,seed){
  const isDev=DEV.has(cc),dev=isDev?1.4:1.0;
  const wayOrderMap=computeWayOrder(streams);  // M7-JS: downstream rank per OSM way

  // ── Spacing: SAME stream needs much wider gaps than cross-stream ──
  // If there's already a net on this stream, another 500m down is redundant
  // Cross-stream nets don't occlude each other — different catchments
  const SAME_STREAM_SPACE=500;   // 500m (~1600ft) along same waterway
  const CROSS_STREAM_SPACE=300;  // 300m (~1000ft) between different streams
  const MAX_W=30;

  // Upstream occlusion: each upstream net on the same stream reduces
  // the generation sub-score by this factor (compounds multiplicatively)
  const CATCH_EFFICIENCY=0.65;  // a net catches ~65% of debris passing through
  // So 1 net upstream → downstream sees 35% of original trash
  // 2 nets upstream → downstream sees 35% × 35% = 12%

  const RISK_PCTILE=pop>1e7?0.35:pop>1e6?0.30:pop>1e5?0.25:0.20;
  const MIN_DEPLOY=5;

  // ── Phase 1: Generate valid positions with wide spacing ──
  // SKIP underground segments — inject tunnel portals as high-priority
  const allPositions=[];
  const globalPlaced=[];
  let id=0;
  // Portal composite bonus, scaled by the parent stream's type. A culvert under
  // a real river is genuinely high-leverage; a culvert under a small unnamed
  // stream is not. Drains/ditches don't reach this point — parseStreams refuses
  // to inject portals for them at all.
  const PORTAL_BONUS_BY_WW={river:5,canal:3,stream:1};
  // Composite penalty applied to surface positions on small drainage features —
  // they shouldn't leapfrog real streams just because their random rolls landed well.
  const WW_PENALTY={ditch:-6,drain:-3};

  // Inject culvert entrance/exit portal points first
  const portals=streams._portals||[];
  for(const pt of portals){
    if(pt.estWidth>MAX_W)continue;
    let tooClose=false;
    for(const p of globalPlaced){if(hvM(p.a,p.o,pt.lat,pt.lon)<CROSS_STREAM_SPACE){tooClose=true;break}}
    if(tooClose)continue;
    globalPlaced.push({o:pt.lon,a:pt.lat});
    // Catchment assumption for portals is intentionally moderate (0.6 / 0.4)
    // rather than extreme (0.95 / 0.05). The old extreme made portals inherit
    // huge upstream catchment numbers and dominate the top 20 even before the
    // bonus was applied. Order=2 instead of 3 for the same reason.
    const isEntrance=pt.type==='entrance';
    allPositions.push({id:id++,lon:pt.lon,lat:pt.lat,
      stream:pt.stream+' ('+pt.type+')',streamWidth:pt.estWidth,waterway:'culvert_portal',
      parentWw:pt.parentWw||'stream',
      riverKey:riverKeyOf({baseName:pt.stream,name:pt.stream}),
      upstreamFrac:isEntrance?0.6:0.4,order:2,streamIdx:-1,coordIdx:0,wayOrder:-1,isPortal:true});
  }

  // Walk surface streams
  for(const st of streams){
    if(st.underground)continue;
    const w=st.estWidth||5;
    if(w>MAX_W)continue;
    const cap=waterwayCapacity(st);
    let countOnStream=0;
    let distAcc=SAME_STREAM_SPACE; // ready to place first

    for(let i=0;i<st.coords.length;i++){
      const[lon,lat]=st.coords[i];
      if(i>0){const[plo,pla]=st.coords[i-1];distAcc+=hvM(pla,plo,lat,lon)}
      if(distAcc<SAME_STREAM_SPACE)continue;

      // Cross-stream check (different streams still need some separation)
      let tooClose=false;
      for(const p of globalPlaced){if(hvM(p.a,p.o,lat,lon)<CROSS_STREAM_SPACE){tooClose=true;break}}
      if(tooClose)continue;
      if(countOnStream>=cap)continue;

      distAcc=0;
      countOnStream++;
      globalPlaced.push({o:lon,a:lat});

      const sIdxG=streams.indexOf(st);
      allPositions.push({id:id++,lon,lat,stream:st.name,streamWidth:w,waterway:st.waterway||'stream',
        riverKey:riverKeyOf(st),
        upstreamFrac:i/Math.max(1,st.coords.length-1),order:st.order,
        streamIdx:sIdxG,coordIdx:i,wayOrder:wayOrderMap.get(sIdxG)??0});
    }
  }

  if(allPositions.length===0)return[];

  // ── Phase 2: Score every position (no occlusion yet — raw potential) ──
  // C3 — DETERMINISM: each candidate gets its OWN RNG seeded by its coordinates,
  // not a single RNG consumed sequentially across all candidates. So a site's
  // values are identical across re-renders; loading more streams only ADDS sites,
  // it never reshuffles existing ones. No Math.random() for any named quantity.
  const scored=allPositions.map(pos=>{
    const uf=pos.upstreamFrac;
    const pr=seededRand(Math.floor(hash01(pos.lat.toFixed(5)+','+pos.lon.toFixed(5))*2147483647)+1+seed);
    const rg=()=>pr()-.5;
    const popD=(800+uf*400)*dev+rg()*200;
    const imp=30+uf*15+rg()*8;
    const vel=.4+uf*.6+rg()*.15;
    const mq=(2+uf*25)*(isDev?1.5:1);
    const stO=Math.min(pos.order,Math.max(1,Math.round(1+uf*3.5)));
    const ca=.5+uf*45;
    const ej=Math.min(1,Math.max(0,.55+(isDev?.15:0)+rg()*.15));
    const ram=Math.max(20,300+rg()*150);
    const cw=Math.max(1,pos.streamWidth+rg()*2);
    const bs=Math.max(2,12+rg()*6);
    const roadD=(5+uf*7)*dev+rg()*2;                 // road density proxy (km/km²)
    const bb=pr()<.25?.2:0;
    const cl=v=>Math.max(0,Math.min(100,v));

    // Generation: population .18, impervious .20 (was an undocumented .40 — C3),
    // road density .10 — mirrors the documented family weights (the rest aren't
    // modeled client-side; this is a separate heuristic, see Docs).
    const gs=cl(popD/20*.18+imp*.20+roadD*3*.10+5);
    const fs=cl(mq*.8*.22+Math.min(vel*40,60)*.16+stO*12*.14+Math.min(ca*1.5,70)*.18);
    // Impact: water-intake & protected-area terms were pure Math.random() (C3).
    // Drive them deterministically from geometry + the per-candidate pr() so they
    // are STABLE across re-renders: intakes matter more upstream (more downstream
    // beneficiaries); protected-area proximity is a stable per-site draw.
    const wiTerm=(0.35+uf*0.55)*100;                 // 35..90: higher upstream
    const paTerm=(0.25+pr()*0.55)*100;               // stable per-site, coord-seeded
    const ips=cl(wiTerm*.22+paTerm*.16+ej*100*.18+(1-Math.min(ca*1.5,70)/100)*100*.14);
    const ras=ram<200?1:ram<500?.8:ram<1000?.6:.3;
    const cws=cw<2?.5:cw<=15?1:cw<=30?.5:.2;
    const vf=vel<.05?.3:vel<.3?.7:vel<=1.5?1:vel<=2.5?.5:.1;
    const bss=bs<15?1:bs<30?.5:.2;
    const fes=cl((ras*.25+cws*.2+vf*.2+.5*.15+bss*.1+bb*.1)*100);
    const portalBonus=pos.isPortal?(PORTAL_BONUS_BY_WW[pos.parentWw]||0):0;
    const wwPenalty=WW_PENALTY[pos.waterway]||0;
    const comp=cl(.3*gs+.25*fs+.3*ips+.15*fes+portalBonus+wwPenalty);

    return{...pos,composite:+comp.toFixed(1),gen:+gs.toFixed(1),flow:+fs.toFixed(1),
      impact:+ips.toFixed(1),feas:+fes.toFixed(1),pop_d:+popD.toFixed(0),imp_pct:+imp.toFixed(1),
      vel:+vel.toFixed(2),mq:+mq.toFixed(1),stream_order:stO,catch_km2:+ca.toFixed(1),
      ej:+ej.toFixed(2),road_m:+ram.toFixed(0),width_m:+cw.toFixed(1),slope_deg:+bs.toFixed(1),
      rawGen:gs};  // keep raw generation for occlusion
  });

  // ── Phase 3: Greedy selection with upstream occlusion ──
  // Instead of just taking top N%, we greedily pick the best site,
  // then discount downstream sites on the same stream, then pick next best.
  // This naturally spreads nets across different waterways.

  // Cap deployments to keep the map snappy regardless of how far the user has panned.
  // Floor: top percentile of scored sites OR ~5% (whichever is bigger), bounded by 80.
  // Ceiling: 250 — beyond that, paint expressions get sluggish.
  const pctCut=Math.ceil(scored.length*RISK_PCTILE);
  const HARD_CAP=250;
  const targetCount=Math.min(HARD_CAP,Math.max(MIN_DEPLOY,pctCut,Math.min(80,Math.ceil(scored.length*0.05))));
  const selected=[];
  const remaining=[...scored];
  // Track how many nets are upstream per RIVER (not per OSM way) — occlusion now
  // spans the whole chained river (M7-JS), keyed by riverKey.
  const upstreamNets={};

  // Downstream test (M7-JS): same river AND further along the chained flow path,
  // ordered by (wayOrder, coordIdx). Portals are point anchors — they neither
  // occlude nor get occluded.
  const isDownstreamOf=(c,best)=>
    c.riverKey===best.riverKey &&
    (c.wayOrder>best.wayOrder || (c.wayOrder===best.wayOrder && c.coordIdx>best.coordIdx));

  while(selected.length<targetCount&&remaining.length>0){
    // Sort remaining by current effective composite (accounts for occlusion)
    remaining.sort((a,b)=>b.composite-a.composite);

    // Pick the best remaining candidate
    const best=remaining.shift();
    selected.push(best);
    if(best.isPortal)continue;  // portals don't occlude downstream sites

    const rKey=best.riverKey;
    upstreamNets[rKey]=(upstreamNets[rKey]||0)+1;
    const netsUp=upstreamNets[rKey];

    for(const c of remaining){
      if(c.isPortal)continue;                 // portals never get occluded
      if(!isDownstreamOf(c,best))continue;
      // Each upstream net lets through (1 - CATCH_EFFICIENCY) of trash; compounds.
      const passthrough=Math.pow(1-CATCH_EFFICIENCY,netsUp);
      const discountedGen=+(c.rawGen*passthrough).toFixed(1);
      // Recompute composite with discounted generation, preserving the
      // waterway-type penalty (otherwise occluded ditches would re-rise).
      const wwPenalty=WW_PENALTY[c.waterway]||0;
      c.gen=discountedGen;
      c.composite=+(.3*discountedGen+.25*c.flow+.3*c.impact+.15*c.feas+wwPenalty).toFixed(1);
    }
  }

  const nPortals=allPositions.filter(p=>p.isPortal).length;
  console.log(`Placement: ${allPositions.length} valid (${nPortals} portal) → ${scored.length} scored → greedy select ${selected.length} (target ${targetCount}, occlusion η=${CATCH_EFFICIENCY})`);
  pipelineStats={total:allPositions.length,scored:scored.length,deployed:selected.length,pctile:RISK_PCTILE,streams:streams.length,filtered:scored.length-selected.length,catchEff:CATCH_EFFICIENCY,portals:nPortals};
  return selected;
}

// ═══ GEOJSON BUILDERS (stamp riverKey onto features so paint expressions can dim non-matches) ═
function buildCandidateGeo(cands){
  return{type:'FeatureCollection',features:(cands||[]).map((c,i)=>({
    type:'Feature',geometry:{type:'Point',coordinates:[c.lon,c.lat]},
    properties:{idx:i,composite:c.composite,riverKey:c.riverKey||riverKeyOf({baseName:c.stream,name:c.stream})}
  }))};
}

// Drawn-stream selector: from the full fetched network (drawStreams) keep only the
// rivers that carry at least one candidate net site. The match is by riverKey (the
// same key used for occlusion / river-focus), NOT per-segment — so a named river that
// has a site draws its WHOLE length (every segment sharing that key), while site-less
// tributaries are hidden. Derived from activeCandidates, so it stays correct wherever
// the streams source is (re)built: openCity, pan-autoload rescore, draw-only pan, and
// style/theme reloads (which re-enter openCity). Candidate generation is untouched.
function siteDrawStreams(){
  const siteRiverKeys=new Set(activeCandidates.map(c=>c.riverKey));
  return drawStreams.filter(s=>siteRiverKeys.has(riverKeyOf(s)));
}

// Distance (m) from a point [lon,lat] to the nearest candidate site. One representative
// point per stream keeps this O(streams × sites) and cheap (~1k × ~70).
function nearestSiteDistM(pt,sites){
  let min=Infinity;
  for(let i=0;i<sites.length;i++){const d=hvM(pt[1],pt[0],sites[i][1],sites[i][0]);if(d<min)min=d;}
  return min===Infinity?1e6:min;
}

// Build the streams source: the FULL fetched network, each feature stamped with
// hasSite (1 if its river carries a candidate net, else 0) and distM (a context
// stream's distance from its midpoint vertex to the nearest site). Site-bearing rivers
// draw full-opacity on the existing layers; every other waterway draws on the context
// layers, faded by distM — a soft distance halo for spatial context without clutter.
// Recomputed wherever the source is (re)built, so it re-fades when candidates change.
function buildStreamLayerGeo(){
  const siteRiverKeys=new Set(activeCandidates.map(c=>c.riverKey));
  const sites=activeCandidates.map(c=>[c.lon,c.lat]);
  return{type:'FeatureCollection',features:drawStreams.map(s=>{
    const hasSite=siteRiverKeys.has(riverKeyOf(s));
    let distM=0;
    if(!hasSite){const mid=s.coords[Math.floor(s.coords.length/2)];distM=Math.round(nearestSiteDistM(mid,sites));}
    return{type:'Feature',geometry:{type:'LineString',coordinates:s.coords},
      properties:{name:s.name,riverKey:riverKeyOf(s),order:s.order,underground:s.underground?1:0,hasSite:hasSite?1:0,distM}};
  })};
}

// ═══ PAN-AUTOLOAD: progressive fetch as the user explores ═══════
function bboxContains(bb,lon,lat){return lon>=bb[0]&&lon<=bb[2]&&lat>=bb[1]&&lat<=bb[3]}

// Fraction of the visible viewport that lies outside every covered bbox.
// Sampled on a 5×5 grid (25 probe points) so the answer is a smooth
// 0..1 instead of a flickery boolean — small pans rarely cross thresholds.
function viewportUncoveredFraction(){
  if(coveredBboxes.length===0)return 1;
  const vb=map.getBounds();
  const W=vb.getWest(),E=vb.getEast(),S=vb.getSouth(),N=vb.getNorth();
  const G=5;
  let uncovered=0;
  for(let i=0;i<G;i++){
    for(let j=0;j<G;j++){
      const lon=W+(E-W)*(i+0.5)/G;
      const lat=S+(N-S)*(j+0.5)/G;
      if(!coveredBboxes.some(b=>bboxContains(b,lon,lat)))uncovered++;
    }
  }
  return uncovered/(G*G);
}

// Cap a bbox to roughly ~25km square so Overpass doesn't time out when zoomed way out.
function clampBbox(s,w,n,e){
  const center=(s+n)/2;
  const maxLat=25/111;
  const maxLon=25/(111*Math.max(0.1,Math.cos(center*Math.PI/180)));
  if((n-s)>maxLat){const c=(n+s)/2;s=c-maxLat/2;n=c+maxLat/2}
  if((e-w)>maxLon){const c=(e+w)/2;w=c-maxLon/2;e=c+maxLon/2}
  return{s,w,n,e};
}

let _pillWatchdog=null;
function setLoadingPill(on,text){
  const el=document.getElementById('load-pill');
  if(!el)return;
  if(text)document.getElementById('load-pill-text').textContent=text;
  el.classList.toggle('vis',on);
  // Watchdog: a hung or rate-limited Overpass fetch must never leave the pill
  // spinning forever. Force-hide after 18s; cleared whenever the pill is toggled.
  if(_pillWatchdog){clearTimeout(_pillWatchdog);_pillWatchdog=null;}
  if(on)_pillWatchdog=setTimeout(()=>{el.classList.remove('vis');_pillWatchdog=null;},18000);
}

function schedulePanFetch(){
  if(activeCityIdx<0)return;
  if(panDebounceTimer)clearTimeout(panDebounceTimer);
  panDebounceTimer=setTimeout(()=>{panDebounceTimer=null;onPanFetch()},250);
}

async function onPanFetch(){
  if(activeCityIdx<0)return;
  // Baked-geometry region cities have their rivers already drawn from the region
  // file — no live Overpass fetching on pan (no clutter, no rate-limit exposure).
  if(hasBakedStreams)return;
  if(initialFetchInFlight)return; // openCity is still loading the city's first batch
  if(riverFetchInFlight)return;
  // Don't bother fetching when zoomed way out — streams aren't visible and Overpass
  // would just time out on continent-scale bboxes.
  if(map.getZoom()<10)return;
  // Soft ceiling on how many bboxes we accumulate per city, to bound work.
  if(coveredBboxes.length>=40)return;

  // Substantial-pan gate: most of the viewport must be uncovered. A small nudge
  // (or a zoom-in inside an already-fetched area) skips the fetch entirely.
  if(viewportUncoveredFraction()<PAN_MIN_UNCOVERED)return;

  if(panFetchInFlight){panFetchQueued=true;return}

  // Rate limit: enforce a minimum gap between fetch starts. If we're inside the
  // cooldown, queue and schedule a single retry timer that fires once the gap
  // has elapsed — so a flurry of pans never drops a load, it just defers it.
  const elapsed=Date.now()-lastPanFetchAt;
  if(elapsed<PAN_MIN_INTERVAL_MS){
    panFetchQueued=true;
    if(!rateLimitTimer){
      rateLimitTimer=setTimeout(()=>{
        rateLimitTimer=null;
        if(panFetchQueued){panFetchQueued=false;onPanFetch()}
      },PAN_MIN_INTERVAL_MS-elapsed+50);
    }
    return;
  }
  lastPanFetchAt=Date.now();

  const vb=map.getBounds();
  let s=vb.getSouth(),w=vb.getWest(),n=vb.getNorth(),e=vb.getEast();
  // 10% buffer so we prefetch slightly outside the visible viewport
  const dLat=(n-s)*0.1,dLon=(e-w)*0.1;
  s-=dLat;n+=dLat;w-=dLon;e+=dLon;
  ({s,w,n,e}=clampBbox(s,w,n,e));

  const cityAtFetch=activeCityIdx;
  panFetchInFlight=true;
  setLoadingPill(true,'Loading more streams…');
  try{
    const newStreams=await fetchStreamsInBbox(s,w,n,e,{timeout:12});
    // Stale-context guard (mirrors openCity's X2 guard): if the user switched cities
    // while this fetch was in flight, don't inject the old city's streams into the new
    // city's draw OR candidate sets.
    if(activeCityIdx!==cityAtFetch)return;
    if(newStreams){
      coveredBboxes.push([w,s,e,n]);
      // DRAW: merge the full network so newly-panned-into rivers render continuous.
      const drawAdded=mergeDraw(newStreams._full);
      // CANDIDATES: apply the SAME per-fetch quality bar the initial city fetch uses,
      // so panning can never sneak in low-priority short ditches or culverts
      // that the initial criteria would have trimmed.
      const filtered=applyQualityBar(newStreams,{maxStreams:25});
      const added=mergeStreams(filtered);
      if(added>0)scheduleRescore();              // re-score + redraw both sources
      else if(drawAdded>0)refreshStreamsSource(); // new geometry only → just redraw streams
    }
  }catch(err){
    console.warn('Pan-autoload fetch failed:',err);
  }finally{
    panFetchInFlight=false;
    setLoadingPill(false);
    // If pans piled up while the fetch was running, re-enter onPanFetch — it
    // will hit the rate-limit branch on its own if the cooldown hasn't elapsed.
    if(panFetchQueued){panFetchQueued=false;onPanFetch()}
  }
}

function scheduleRescore(){
  if(rescoreTimer)return;
  rescoreTimer=setTimeout(()=>{
    rescoreTimer=null;
    if(activeCityIdx<0)return;
    // Region cities show precomputed real sites — panning must never replace
    // them with regenerated client-side estimates. But newly-panned-in OSM rivers
    // can name more of the real sites, so re-run the nearest-river match and
    // redraw (sites stay fixed; only their names/river highlights update).
    if(activeRegionSlug){nameRegionSitesByNearestRiver();refreshMapSources();renderCityView();return}
    activeCandidates=generateCandidates(activeStreams,activePop,activeCC,activeSeed);
    refreshMapSources();
    renderCityView();
  },400);
}

function refreshMapSources(){
  const sSrc=map.getSource('streams');
  if(sSrc)sSrc.setData(buildStreamLayerGeo());  // site rivers full; others fade by distance
  const cSrc=map.getSource('candidates');
  if(cSrc)cSrc.setData(buildCandidateGeo(activeCandidates));
  // Re-apply focus paint in case the new data introduced more matching features
  if(focusedRiverKey)applyFocusPaint();
}

// Lightweight redraw of just the streams layer (used when new geometry arrived but
// no new candidate-eligible streams did, so a full re-score is unnecessary). Still
// re-applies the has-a-site filter so panning reveals more of an existing site-river
// without surfacing site-less tributaries.
function refreshStreamsSource(){
  const sSrc=map.getSource('streams');
  if(sSrc)sSrc.setData(buildStreamLayerGeo());
  if(focusedRiverKey)applyFocusPaint();
}

// Context (no-site) waterways fade with distance to the nearest candidate net:
// brightest right beside a site-bearing river, ~transparent far away. Driven per
// feature by the distM property stamped in buildStreamLayerGeo().
const CONTEXT_FADE=['interpolate',['linear'],['get','distM'],0,1.0,2500,0.6,6000,0.3];

// ═══ RIVER FOCUS: click a stream to trace the entire named river ═
// Original opacity values restored when focus is cleared.
const ORIG_PAINT={
  'streams':{'line-opacity':1.0},
  'streams-outline':{'line-opacity':0.4},
  'streams-underground':{'line-opacity':0.6},
  'streams-context':{'line-opacity':CONTEXT_FADE},
  'streams-context-underground':{'line-opacity':CONTEXT_FADE},
  'candidates':{'circle-opacity':1.0,'circle-stroke-opacity':1.0},
  'cand-glow':{'circle-opacity':0.25}
};

function applyFocusPaint(){
  const setIf=(layer,prop,val)=>{if(map.getLayer(layer))map.setPaintProperty(layer,prop,val)};
  if(!focusedRiverKey){
    for(const layer of Object.keys(ORIG_PAINT))
      for(const prop of Object.keys(ORIG_PAINT[layer]))
        setIf(layer,prop,ORIG_PAINT[layer][prop]);
    return;
  }
  const expr=(matchVal,dimVal)=>['case',['==',['get','riverKey'],focusedRiverKey],matchVal,dimVal];
  setIf('streams','line-opacity',expr(0.95,0.15));
  setIf('streams-outline','line-opacity',expr(0.5,0.08));
  setIf('streams-underground','line-opacity',expr(0.7,0.12));
  // Context lines (always non-focused rivers) recede to a whisper during focus.
  setIf('streams-context','line-opacity',0.12);
  setIf('streams-context-underground','line-opacity',0.12);
  setIf('candidates','circle-opacity',expr(1.0,0.18));
  setIf('candidates','circle-stroke-opacity',expr(1.0,0.18));
  setIf('cand-glow','circle-opacity',expr(0.35,0.05));
}

function onStreamClick(e){
  const f=e.features&&e.features[0];
  if(!f)return;
  const key=f.properties.riverKey;
  const name=f.properties.name||'Unnamed waterway';
  const baseName=name.replace(/\s*\(culvert\)$/,'').replace(/\s*\((entrance|exit)\)$/,'');
  enterRiverFocus(key,baseName,e.lngLat);
}

async function enterRiverFocus(key,name,lngLat){
  if(!key)return;
  // If clicking the same river again, treat as a refresh — no-op if a fetch is in flight
  if(focusedRiverKey===key&&riverFetchInFlight)return;
  focusedRiverKey=key;
  focusedRiverName=name;
  applyFocusPaint();
  renderCityView();

  // Skip the global river fetch for unnamed waterways — they're a single segment by design
  if(key.startsWith('__unnamed_')){
    flyToFocusedRiver();
    return;
  }
  // Baked-geometry region cities: the baked line already IS the merged whole
  // river for this region — focus and frame it without any live Overpass trace.
  if(hasBakedStreams){
    flyToFocusedRiver();
    return;
  }
  if(riverFetchInFlight)return;

  riverFetchInFlight=true;
  setLoadingPill(true,'Tracing whole river…');
  try{
    const newStreams=await fetchRiverByName(name,lngLat.lat,lngLat.lng);
    if(newStreams){
      const drawAdded=mergeDraw(newStreams._full);  // full river geometry → continuous trace
      const added=mergeStreams(newStreams);
      if(added>0&&!activeRegionSlug){   // region cities keep their real sites fixed
        activeCandidates=generateCandidates(activeStreams,activePop,activeCC,activeSeed);
        refreshMapSources();
      }else if(drawAdded>0||added>0){
        refreshStreamsSource();  // wide/short reaches drawn even if not candidate-eligible
      }
    }
    flyToFocusedRiver();
  }catch(err){
    console.warn('River fetch failed:',err);
  }finally{
    riverFetchInFlight=false;
    setLoadingPill(false);
    renderCityView();
    // Pan-autoload was paused; if the user moved while we were fetching, give it a kick
    if(panFetchQueued){panFetchQueued=false;setTimeout(onPanFetch,200)}
  }
}

function flyToFocusedRiver(){
  if(!focusedRiverKey)return;
  const segs=drawStreams.filter(s=>riverKeyOf(s)===focusedRiverKey);  // frame the full river
  if(!segs.length)return;
  const bounds=new mapboxgl.LngLatBounds();
  for(const seg of segs)for(const c of seg.coords)bounds.extend(c);
  if(bounds.isEmpty())return;
  map.fitBounds(bounds,{padding:60,maxZoom:13,duration:1500});
}

function exitRiverFocus(){
  if(!focusedRiverKey)return;
  focusedRiverKey=null;
  focusedRiverName=null;
  applyFocusPaint();
  renderCityView();
}

// ═══ MAP ════════════════════════════════════════════════════════
// Named hover helpers so re-renders don't accumulate listeners.
const cursorPointer=()=>map.getCanvas().style.cursor='pointer';
const cursorReset=()=>map.getCanvas().style.cursor='';

// Replace the loading spinner with a clear, terminal error state. Without this a
// missing token left the "Loading GRIME…" spinner up forever (the Map constructor
// throws on an empty token), and an invalid/rejected token left a silently blank
// app (style 401/403 → map never fires 'load' → world view never renders).
function showFatalError(title,detail){
  const spin=document.getElementById('loading');
  if(spin)spin.style.display='none';
  let el=document.getElementById('fatal-error');
  if(!el){
    el=document.createElement('div');
    el.id='fatal-error';
    el.style.cssText='position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;text-align:center';
    document.body.appendChild(el);
  }
  el.innerHTML=`<div style="max-width:400px;font-family:var(--mono)">
    <div style="font-size:30px;margin-bottom:14px">🗺️</div>
    <div style="font-size:16px;font-weight:600;color:var(--t);margin-bottom:10px">${esc(title)}</div>
    <div style="font-size:12px;color:var(--td);line-height:1.7">${esc(detail)}</div></div>`;
}

async function initMap(){
  const token=await getMapboxToken();
  if(!token){
    showFatalError('Map unavailable',
      'No Mapbox token is configured. Set the MAPBOX_TOKEN environment variable (see .env.example) and reload the page.');
    return false;
  }
  mapboxgl.accessToken=token;
  try{
    map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/satellite-streets-v12',center:[20,15],zoom:2,pitch:0,maxZoom:18});
    currentMapStyle='mapbox://styles/mapbox/satellite-streets-v12';
  }catch(err){
    showFatalError('Map failed to initialize',String((err&&err.message)||err));
    return false;
  }
  // Surface an invalid / URL-restricted token (style 401/403) as a clear message
  // instead of a silently blank map. Fires once; ignores transient tile errors.
  let authFailed=false;
  map.on('error',e=>{
    const st=e&&e.error&&e.error.status;
    if((st===401||st===403)&&!authFailed){
      authFailed=true;
      showFatalError('Map unavailable',
        'The Mapbox token was rejected (HTTP '+st+'). Check that MAPBOX_TOKEN is valid and permitted for this origin.');
    }
  });
  map.addControl(new mapboxgl.NavigationControl(),'top-right');
  map.addControl(new mapboxgl.ScaleControl(),'bottom-right');
  // Pan-autoload: any move while in city view triggers a debounced fetch of uncovered area
  map.on('moveend',schedulePanFetch);
  // River-focus click handlers — attached once. Mapbox keeps them dormant until
  // the layers exist, and they automatically pick up new sources when re-added.
  map.on('click','streams',onStreamClick);
  map.on('click','streams-underground',onStreamClick);
  map.on('mouseenter','streams',cursorPointer);
  map.on('mouseleave','streams',cursorReset);
  map.on('mouseenter','streams-underground',cursorPointer);
  map.on('mouseleave','streams-underground',cursorReset);
  // Candidate click + hover (used to live in openCity, where it leaked listeners)
  map.on('click','candidates',e=>{const f=e.features&&e.features[0];if(f)selectCand(f.properties.idx)});
  map.on('mouseenter','candidates',cursorPointer);
  map.on('mouseleave','candidates',cursorReset);
  // Cluster / unclustered place handlers — attached ONCE here (X3). These used to
  // live in loadWorldView, which re-runs on every "← All cities", search-in-city,
  // and theme reload, so Mapbox accumulated a fresh listener each time → one click
  // fired openCity() N times → N parallel Overpass fetches. Dormant until the
  // 'places' layers exist, and they pick up re-added sources automatically.
  map.on('click','clusters',e=>{map.easeTo({center:e.features[0].geometry.coordinates,zoom:map.getZoom()+3})});
  map.on('click','unclustered',e=>{openCity(e.features[0].properties.idx)});
  map.on('mouseenter','clusters',cursorPointer);
  map.on('mouseleave','clusters',cursorReset);
  map.on('mouseenter','unclustered',cursorPointer);
  map.on('mouseleave','unclustered',cursorReset);
  // Clicking blank map (no stream/candidate hit) clears river focus
  map.on('click',e=>{
    if(!focusedRiverKey)return;
    const hits=map.queryRenderedFeatures(e.point,{layers:['streams','streams-underground','candidates'].filter(l=>map.getLayer(l))});
    if(hits.length===0)exitRiverFocus();
  });
  return true;
}

function resetExploreState(){
  coveredBboxes=[];
  streamKeySet.clear();
  drawStreams=[];drawKeySet.clear();
  hasBakedStreams=false;
  focusedRiverKey=null;focusedRiverName=null;
  panFetchInFlight=false;panFetchQueued=false;
  riverFetchInFlight=false;
  initialFetchInFlight=false;
  lastPanFetchAt=0;
  if(panDebounceTimer){clearTimeout(panDebounceTimer);panDebounceTimer=null}
  if(rescoreTimer){clearTimeout(rescoreTimer);rescoreTimer=null}
  if(rateLimitTimer){clearTimeout(rateLimitTimer);rateLimitTimer=null}
  setLoadingPill(false);
}

// Run a layer-building fn now; if the style is mid-setStyle (theme/satellite
// toggle rebuilds it from scratch), Mapbox throws "Style is not done loading"
// from addSource/addLayer — catch exactly that and re-run once the incoming
// style fires 'style.load' (guaranteed to fire during a setStyle reload). All
// builders below are idempotent, so a re-run can't double-add.
// `stillValid` (optional) is re-checked when the deferred run fires: navigation
// during the reload (back button, city switch) makes the queued builder stale —
// without the check it would paint the previous view's layers over the new one.
// The deferred run re-enters this wrapper so a second overlapping setStyle
// defers again instead of throwing uncaught inside Mapbox's event dispatch.
// NOTE deliberately NOT map.isStyleLoaded(): that also reports false while mere
// TILES are loading (every flyTo/fitBounds), where 'style.load' never fires —
// a predicate guard on it deferred the layers forever and left region cities
// with data but no rendered sites/rivers.
function withWritableStyle(fn,stillValid){
  try{fn();}
  catch(e){
    if(/not done loading/i.test(String((e&&e.message)||e))){
      map.once('style.load',()=>{
        if(stillValid&&!stillValid())return;
        withWritableStyle(fn,stillValid);
      });
      return;
    }
    throw e;
  }
}

function loadWorldView(){
  activeCityIdx=-1;activeCandidates=[];activeStreams=[];drawStreams=[];selectedCand=null;activeRegionSlug=null;
  renderSelectedCandPanel();
  resetExploreState();
  // Sidebar/world-view chrome is map-independent — update it now even if we have to
  // defer the map layers below.
  document.getElementById('back-btn').classList.remove('vis');
  document.getElementById('city-view').classList.remove('vis');
  document.getElementById('place-list').style.display='';
  showStats();renderPlaceList();
  // If a style reload is mid-flight, adding the 'places' source throws — the
  // wrapper re-runs this builder on 'style.load' (state above is already reset),
  // unless the user has since opened a city (world layers would paint over it).
  withWritableStyle(()=>{
    clearLayers();
    const geojson={type:'FeatureCollection',features:places.map((p,i)=>({
      type:'Feature',geometry:{type:'Point',coordinates:[p.lo,p.la]},
      properties:{idx:i,name:p.n||'Unknown',cc:p.c||'??',pop:p.p||0}
    }))};
    map.addSource('places',{type:'geojson',data:geojson,cluster:true,clusterMaxZoom:12,clusterRadius:40});
    map.addLayer({id:'clusters',type:'circle',source:'places',filter:['has','point_count'],paint:{
      'circle-color':['step',['get','point_count'],'#1D9E75',50,'#378ADD',200,'#7F77DD',1000,'#22d3ee'],
      'circle-radius':['step',['get','point_count'],14,50,18,200,22,1000,28],
      'circle-stroke-width':2,'circle-stroke-color':'#ffffff'
    }});
    map.addLayer({id:'cluster-count',type:'symbol',source:'places',filter:['has','point_count'],layout:{'text-field':'{point_count_abbreviated}','text-size':11,'text-font':['DIN Pro Medium','Arial Unicode MS Regular']},paint:{'text-color':'#ffffff'}});
    map.addLayer({id:'unclustered',type:'circle',source:'places',filter:['!',['has','point_count']],paint:{
      'circle-radius':['interpolate',['linear'],['get','pop'],1000,3,100000,6,1000000,10,10000000,14],
      'circle-color':['interpolate',['linear'],['get','pop'],1000,'#10b981',100000,'#3b82f6',1000000,'#8b5cf6',10000000,'#22d3ee'],
      'circle-stroke-width':1.5,'circle-stroke-color':'#ffffff'
    }});
    // Cluster/unclustered click + hover handlers are attached ONCE in initMap (X3) —
    // re-registering them here leaked a listener per loadWorldView call.
  },()=>activeCityIdx<0);   // stale once a city is open — don't paint world layers over it
}

function clearLayers(){
  ['stream-labels','streams-underground','streams-outline','streams','streams-context','streams-context-underground','cand-glow','candidates','cluster-count','clusters','unclustered'].forEach(id=>{if(map.getLayer(id))map.removeLayer(id)});
  ['places','streams','candidates'].forEach(id=>{if(map.getSource(id))map.removeSource(id)});
}

// Add the streams + candidates map layers from the current activeCandidates /
// drawStreams state. Extracted so BOTH the unscored path and the scored-region
// fast path add identical layers (and so the region path can add them before
// the OSM river fetch has returned).
function addMapLayers(){
  // A theme/satellite toggle mid-openCity leaves the style reloading; adding sources
  // then throws "Style is not done loading" — the wrapper catches exactly that and
  // re-runs on style.load (safe: this builder is idempotent). Stale once the user
  // navigates on (newer openCity, or back to world view) before the reload lands.
  const t=openCityToken;
  withWritableStyle(_addMapLayersNow,()=>t===openCityToken&&activeCityIdx>=0);
}
function _addMapLayersNow(){
  // Idempotent: a rapid re-open of the same city can race two openCity flows into
  // here; without this, the second map.addSource('streams') throws "There is already
  // a source with ID streams" and wedges the map. Remove any prior stream/candidate
  // layers+sources first (the openCity generation token normally prevents the double
  // call; this is belt-and-suspenders since a duplicate-source throw is fatal).
  ['stream-labels','streams-underground','streams-outline','streams','streams-context','streams-context-underground','cand-glow','candidates'].forEach(id=>{if(map.getLayer(id))map.removeLayer(id)});
  ['streams','candidates'].forEach(id=>{if(map.getSource(id))map.removeSource(id)});
  // Draw streams from the full network. Rivers with a candidate site (hasSite=1) render
  // full-opacity on the styled layers below; every other waterway (hasSite=0) renders on
  // the CONTEXT layers, faded by distance to the nearest site — a soft halo, not on/off.
  map.addSource('streams',{type:'geojson',data:buildStreamLayerGeo()});
  // Context layers first so they sit UNDER the bright site-bearing rivers.
  map.addLayer({id:'streams-context',type:'line',source:'streams',filter:['all',['==',['get','underground'],0],['==',['get','hasSite'],0]],paint:{'line-color':'#00e5ff','line-width':['interpolate',['linear'],['get','order'],1,1.2,4,3],'line-opacity':CONTEXT_FADE},layout:{'line-cap':'round','line-join':'round'}});
  map.addLayer({id:'streams-context-underground',type:'line',source:'streams',filter:['all',['==',['get','underground'],1],['==',['get','hasSite'],0]],paint:{'line-color':'#f59e0b','line-width':1.5,'line-opacity':CONTEXT_FADE,'line-dasharray':[2,3]},layout:{'line-cap':'round','line-join':'round'}});
  // Site-bearing rivers — full opacity, full styling (dark outline + labels).
  map.addLayer({id:'streams-outline',type:'line',source:'streams',filter:['all',['==',['get','underground'],0],['==',['get','hasSite'],1]],paint:{'line-color':'#000','line-width':['interpolate',['linear'],['get','order'],1,4,4,7],'line-opacity':.4},layout:{'line-cap':'round','line-join':'round'}});
  map.addLayer({id:'streams',type:'line',source:'streams',filter:['all',['==',['get','underground'],0],['==',['get','hasSite'],1]],paint:{'line-color':'#00e5ff','line-width':['interpolate',['linear'],['get','order'],1,1.5,4,4],'line-opacity':1.0},layout:{'line-cap':'round','line-join':'round'}});
  map.addLayer({id:'streams-underground',type:'line',source:'streams',filter:['all',['==',['get','underground'],1],['==',['get','hasSite'],1]],paint:{'line-color':'#f59e0b','line-width':2,'line-opacity':.6,'line-dasharray':[2,3]},layout:{'line-cap':'round','line-join':'round'}});
  map.addLayer({id:'stream-labels',type:'symbol',source:'streams',filter:['==',['get','hasSite'],1],layout:{'symbol-placement':'line','text-field':['get','name'],'text-size':12,'text-font':['DIN Pro Medium','Arial Unicode MS Regular'],'text-offset':[0,-1],'text-allow-overlap':false},paint:{'text-color':'#fff','text-halo-color':'#000','text-halo-width':1.5}});

  // Draw candidates (click + hover handlers are attached once in initMap)
  map.addSource('candidates',{type:'geojson',data:buildCandidateGeo(activeCandidates)});
  map.addLayer({id:'cand-glow',type:'circle',source:'candidates',paint:{'circle-radius':['interpolate',['linear'],['get','composite'],20,12,55,22],'circle-color':['interpolate',['linear'],['get','composite'],20,'#ef4444',30,'#f59e0b',40,'#10b981',50,'#22d3ee'],'circle-opacity':.25,'circle-blur':1}});
  map.addLayer({id:'candidates',type:'circle',source:'candidates',paint:{'circle-radius':['interpolate',['linear'],['get','composite'],20,6,55,12],'circle-color':['interpolate',['linear'],['get','composite'],20,'#ef4444',30,'#f59e0b',40,'#10b981',50,'#22d3ee'],'circle-stroke-width':2.5,'circle-stroke-color':'#fff'}});
}

// Header info line — counts DISTINCT site-bearing rivers actually drawn (a river
// split across several ways/parts still counts once), not raw line segments.
function updateCityInfo(name){
  const drawn=siteDrawStreams();
  let nSurface=new Set(drawn.filter(s=>!s.underground).map(s=>riverKeyOf(s))).size;
  const nUnderground=drawn.filter(s=>s.underground).length;
  const nPortals=((activeStreams&&activeStreams._portals)||[]).length;
  // Fallback while nothing is drawn yet (old region data mid-background-fetch, or
  // Overpass slow/rate-limited): count distinct NAMED waterways among the scored
  // sites so the header never shows a misleading "0 surface rivers"; drop the
  // clause entirely if there genuinely isn't a named surface waterway yet.
  if(nSurface===0){
    const names=new Set();
    for(const c of activeCandidates){const s=(c.stream||'');if(s&&!/^Segment /.test(s))names.add(s);}
    nSurface=names.size;
  }
  const surfaceInfo=nSurface>0?` · ${nSurface} surface rivers`:'';
  const portalInfo=nUnderground>0?` · ${nUnderground} culverts · ${nPortals} portals`:'';
  document.getElementById('info').textContent=`${name||'Unknown'} · ${activeCandidates.length} nets${surfaceInfo}${portalInfo} · top ${pipelineStats?Math.round(pipelineStats.pctile*100):25}%`;
}

// Frame the map to the current candidate set (used by the region fast path so
// all real sites are visible without waiting on the OSM fetch).
function fitToCandidates(){
  if(!activeCandidates.length)return;
  const b=new mapboxgl.LngLatBounds();
  for(const c of activeCandidates)b.extend([c.lon,c.lat]);
  if(!b.isEmpty())map.fitBounds(b,{padding:70,maxZoom:14,duration:1200});
}

// Region (real-pipeline) sites come from the DEM stream network and carry only a
// numeric segment id — no waterway name. Once the OSM rivers are loaded, snap each
// site to its nearest named surface waterway (≤300 m) and adopt that river's name
// AND riverKey, so the sidebar/panel show real names and the river highlights +
// labels light up (siteDrawStreams matches on riverKey).
function nameRegionSitesByNearestRiver(){
  // Only NAMED surface waterways can lend a name; drop the generic ones up front.
  const surf=drawStreams.filter(s=>{
    if(s.underground||!s.coords||s.coords.length<2)return false;
    const nm=(s.baseName||s.name||'').replace(/\s*\(culvert\)$/,'').trim();
    return nm&&!/^(river|creek|stream|canal|drain|ditch)$/i.test(nm);
  });
  if(!surf.length)return;
  const BOX=0.05;  // ~5 km cheap lat/lon pre-filter box
  for(const c of activeCandidates){
    if(!/^Segment /.test(c.stream))continue;   // already has a baked river name — leave it
    let best=null,bestD=Infinity;
    for(const s of surf){
      const c0=s.coords[0];
      if(Math.abs(c0[1]-c.lat)>BOX&&Math.abs(c0[0]-c.lon)>BOX)continue;  // far → skip
      const step=Math.max(1,Math.floor(s.coords.length/40));            // subsample long ways
      for(let i=0;i<s.coords.length;i+=step){
        const pt=s.coords[i];
        const d=hvM(c.lat,c.lon,pt[1],pt[0]);
        if(d<bestD){bestD=d;best=s;if(d<25)break;}                      // close enough
      }
      if(bestD<25)break;
    }
    if(best&&bestD<=300){
      c.stream=(best.baseName||best.name||'').replace(/\s*\(culvert\)$/,'').trim();
      c.riverKey=riverKeyOf(best);
    }
  }
}

// Monotonic generation token. Every openCity() call bumps it and captures its own
// value; after each await it bails if a newer openCity() has started. Unlike the
// old `activeCityIdx!==idx` guard, this also aborts a stale flow when the SAME city
// is reopened concurrently (double-click / repeated dot-click), which otherwise let
// two flows both reach addMapLayers() → "already a source with ID streams" throw.
let openCityToken=0;
async function openCity(idx){
  if(idx<0||idx>=places.length)return;
  const p=places[idx];
  if(!p||!p.n)return;
  const myToken=++openCityToken;
  activeCityIdx=idx;selectedCand=null;
  renderSelectedCandPanel();
  // Remember city params so pan-autoload can re-score the merged stream set without
  // reaching back into `places[idx]` (which can race with a back-btn click).
  activePop=p.p;activeCC=p.c;
  activeSeed=Math.round(Math.abs(p.la*1000)+Math.abs(p.lo*1000)+p.p);
  resetExploreState();
  clearLayers();

  // Show loading in sidebar
  document.getElementById('back-btn').classList.add('vis');
  document.getElementById('place-list').style.display='none';
