  document.getElementById('sidebar-title').textContent=`${p.n||'Unknown'}, ${p.c||''}`;
  document.getElementById('city-view').classList.add('vis');
  const spin=msg=>document.getElementById('city-view').innerHTML=`<div style="padding:20px;text-align:center;color:var(--td);font-family:var(--mono);font-size:12px"><div style="margin-bottom:8px">${msg}</div><div style="width:24px;height:24px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto"></div></div>`;
  spin('Fetching real rivers from OpenStreetMap...');

  map.flyTo({center:[p.lo,p.la],zoom:14,pitch:20,duration:1500});
  const seed=activeSeed;

  // ── SCORED-REGION FAST PATH ─────────────────────────────────────────────
  // If this city sits in a precomputed real-pipeline region, show its REAL
  // scored sites IMMEDIATELY from the API. Do NOT block on the Overpass river
  // fetch — big metros (Charlotte, NYC) have heavy waterway queries that can
  // hang or rate-limit, which previously left the page stuck on the spinner
  // even though the real data was ready. OSM rivers then load in the background
  // to draw the waterways and give each site its real river name.
  activeRegionSlug=null;
  await loadRegionsIndex();
  if(myToken!==openCityToken)return;
  const cityRegion=regionForPoint(p.lo,p.la);
  if(cityRegion){
    spin('Loading real scored sites…');
    // Guard pan-autoload while the region doc is in flight: on a slow network the
    // flyTo's moveend lands BEFORE this fetch resolves, and pan-autoload would
    // fire a live Overpass call in the gap before hasBakedStreams is set.
    initialFetchInFlight=true;
    let doc;
    try{
      doc=await fetchRegionCandidates(cityRegion.slug);
    }finally{
      initialFetchInFlight=false;
    }
    if(myToken!==openCityToken)return;
    if(doc&&doc.features&&doc.features.length){
      activeRegionSlug=cityRegion.slug;
      activeCandidates=doc.features.map(regionFeatureToCandidate);
      activeStreams=[];
      pipelineStats={total:doc.features.length,scored:doc.features.length,deployed:doc.features.length,
        pctile:1,streams:0,filtered:0,catchEff:0.65,portals:0};
      // BAKED GEOMETRY (preferred): the region file carries the merged waterway
      // lines (one clean line per site-bearing river, baked from OSM+NHD by
      // scripts/add_river_names.py). Render them directly — instant, reliable,
      // zero live-Overpass dependency, no context clutter, no culvert stubs.
      const baked=bakedStreamsToDraw(doc.streams);
      if(baked.length){
        hasBakedStreams=true;
        drawStreams=baked;
        drawKeySet=new Set(baked.map(streamKey));
      }
      addMapLayers();                         // sites + baked rivers render NOW
      fitToCandidates();
      updateCityInfo(p.n);
      renderCityView();
      if(baked.length)return;                 // no live fetch needed at all
      // FALLBACK (older region data without baked streams): background-fetch OSM
      // waterways to draw the rivers and name the sites, as before.
      fetchRealStreams(p.la,p.lo,p.p).then(fetched=>{
        if(myToken!==openCityToken||activeRegionSlug!==cityRegion.slug||!fetched)return;
        if(fetched.draw)mergeDraw(fetched.draw);
        activeStreams=fetched.cands||[];
        nameRegionSitesByNearestRiver();      // Segment N → real river names + riverKeys
        refreshMapSources();                  // redraw streams (now site-bearing) + candidates
        updateCityInfo(p.n);
        renderCityView();
      }).catch(()=>{}).finally(()=>{
        // Whether the background river fetch succeeded, failed, or timed out, stop the
        // "Loading more streams…" pill — the real scored sites are already on the map.
        if(myToken===openCityToken)setLoadingPill(false);
      });
      return;
    }
    activeRegionSlug=null;                     // region unavailable → unscored path below
  }

  // ── UNSCORED CITY: original Overpass-first path (unchanged behavior) ─────
  initialFetchInFlight=true;
  // X2: await into a LOCAL first. A slow fetch for city A must not clobber the
  // global activeStreams after the user has already opened city B. Only assign
  // the global once we've confirmed this call is still the active city.
  let fetched;
  try{
    fetched=await fetchRealStreams(p.la,p.lo,p.p);
  }finally{
    initialFetchInFlight=false;
  }
  // Guard against a stale fetch returning after the user navigated away
  if(myToken!==openCityToken)return;
  activeStreams=fetched?fetched.cands:null;
  // Populate the render set AFTER the stale-guard so a late city-A fetch can't
  // clobber city B's drawn geometry (same protection activeStreams gets).
  if(fetched&&fetched.draw)mergeDraw(fetched.draw);

  // No waterway data available for this location
  if(!activeStreams||activeStreams.length===0){
    activeCandidates=[];
    activeStreams=[];
    renderSelectedCandPanel();
    document.getElementById('info').textContent=`${p.n||'Unknown'} · No waterway data in OpenStreetMap`;
    document.getElementById('city-view').innerHTML=`
      <div style="padding:24px 16px;text-align:center">
        <div style="font-size:28px;margin-bottom:12px">🏜️</div>
        <div style="font-size:14px;font-weight:500;color:var(--t);margin-bottom:8px">No waterway data available</div>
        <div style="font-size:12px;color:var(--td);line-height:1.6">
          OpenStreetMap has no mapped rivers, streams, or canals within ${p.p>1e6?'8':'4–6'}km of ${esc(p.n||'this location')}.<br><br>
          This can happen in arid regions, areas with poor OSM coverage, or generated township names that don't correspond to real settlements.<br><br>
          Try a nearby larger city, or use the Python pipeline with USGS DEM data for US locations.
        </div>
      </div>`;
    return;
  }

  activeCandidates=generateCandidates(activeStreams,p.p,p.c,seed);
  addMapLayers();
  updateCityInfo(p.n);
  renderCityView();
}

function selectCand(i){
  selectedCand=Number(i);
  const c=activeCandidates[i];
  if(c)map.flyTo({center:[c.lon,c.lat],zoom:16,duration:600});
  renderCityView();
}

function clearSelectedCand(){
  selectedCand=null;
  renderCityView();
}

// ═══ SIDEBAR ════════════════════════════════════════════════════
function showStats(){
  const cc=new Set(places.map(p=>p.c));
  const n=places.length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-v">${n.toLocaleString()}</div><div class="stat-l">Cities</div></div>
    <div class="stat"><div class="stat-v">${cc.size}</div><div class="stat-l">Countries</div></div>
    <div class="stat"><div class="stat-v">27</div><div class="stat-l">Params</div></div>
    <div class="stat"><div class="stat-v">∞</div><div class="stat-l">On-demand</div></div>`;
  document.getElementById('info').textContent=`${n.toLocaleString()} cities · ${cc.size} countries`;
  document.getElementById('sidebar-title').textContent='Global coverage';
}

// ── Country name lookup for search ──
const CC_NAMES={"AD":"Andorra","AE":"UAE","AF":"Afghanistan","AG":"Antigua","AL":"Albania","AM":"Armenia","AO":"Angola","AR":"Argentina","AT":"Austria","AU":"Australia","AZ":"Azerbaijan","BA":"Bosnia","BB":"Barbados","BD":"Bangladesh","BE":"Belgium","BF":"Burkina Faso","BG":"Bulgaria","BH":"Bahrain","BI":"Burundi","BJ":"Benin","BN":"Brunei","BO":"Bolivia","BR":"Brazil","BS":"Bahamas","BT":"Bhutan","BW":"Botswana","BY":"Belarus","BZ":"Belize","CA":"Canada","CD":"Congo DR","CF":"Central African Rep","CG":"Congo","CH":"Switzerland","CI":"Ivory Coast","CL":"Chile","CM":"Cameroon","CN":"China","CO":"Colombia","CR":"Costa Rica","CU":"Cuba","CV":"Cape Verde","CY":"Cyprus","CZ":"Czechia","DE":"Germany","DJ":"Djibouti","DK":"Denmark","DM":"Dominica","DO":"Dominican Rep","DZ":"Algeria","EC":"Ecuador","EE":"Estonia","EG":"Egypt","ER":"Eritrea","ES":"Spain","ET":"Ethiopia","FI":"Finland","FJ":"Fiji","FR":"France","GA":"Gabon","GB":"UK","GE":"Georgia","GH":"Ghana","GM":"Gambia","GN":"Guinea","GQ":"Eq Guinea","GR":"Greece","GT":"Guatemala","GW":"Guinea-Bissau","GY":"Guyana","HK":"Hong Kong","HN":"Honduras","HR":"Croatia","HT":"Haiti","HU":"Hungary","ID":"Indonesia","IE":"Ireland","IL":"Israel","IN":"India","IQ":"Iraq","IR":"Iran","IS":"Iceland","IT":"Italy","JM":"Jamaica","JO":"Jordan","JP":"Japan","KE":"Kenya","KG":"Kyrgyzstan","KH":"Cambodia","KM":"Comoros","KN":"St Kitts","KP":"North Korea","KR":"South Korea","KW":"Kuwait","KZ":"Kazakhstan","LA":"Laos","LB":"Lebanon","LK":"Sri Lanka","LR":"Liberia","LS":"Lesotho","LT":"Lithuania","LU":"Luxembourg","LV":"Latvia","LY":"Libya","MA":"Morocco","MD":"Moldova","ME":"Montenegro","MG":"Madagascar","MK":"N Macedonia","ML":"Mali","MM":"Myanmar","MN":"Mongolia","MR":"Mauritania","MT":"Malta","MU":"Mauritius","MV":"Maldives","MW":"Malawi","MX":"Mexico","MY":"Malaysia","MZ":"Mozambique","NA":"Namibia","NE":"Niger","NG":"Nigeria","NI":"Nicaragua","NL":"Netherlands","NO":"Norway","NP":"Nepal","NZ":"New Zealand","OM":"Oman","PA":"Panama","PE":"Peru","PG":"Papua New Guinea","PH":"Philippines","PK":"Pakistan","PL":"Poland","PS":"Palestine","PT":"Portugal","PY":"Paraguay","QA":"Qatar","RO":"Romania","RS":"Serbia","RU":"Russia","RW":"Rwanda","SA":"Saudi Arabia","SB":"Solomon Is","SC":"Seychelles","SD":"Sudan","SE":"Sweden","SG":"Singapore","SI":"Slovenia","SK":"Slovakia","SL":"Sierra Leone","SM":"San Marino","SN":"Senegal","SO":"Somalia","SR":"Suriname","SS":"South Sudan","SV":"El Salvador","SY":"Syria","SZ":"Eswatini","TD":"Chad","TG":"Togo","TH":"Thailand","TJ":"Tajikistan","TL":"Timor-Leste","TM":"Turkmenistan","TN":"Tunisia","TO":"Tonga","TR":"Turkey","TT":"Trinidad","TW":"Taiwan","TZ":"Tanzania","UA":"Ukraine","UG":"Uganda","US":"United States","UY":"Uruguay","UZ":"Uzbekistan","VA":"Vatican","VC":"St Vincent","VE":"Venezuela","VN":"Vietnam","VU":"Vanuatu","WS":"Samoa","XK":"Kosovo","YE":"Yemen","ZA":"South Africa","ZM":"Zambia","ZW":"Zimbabwe"};
// Reverse lookup: "united states" → "US", "india" → "IN", etc.
const NAME_TO_CC={};
for(const[cc,name]of Object.entries(CC_NAMES)){NAME_TO_CC[name.toLowerCase()]=cc;NAME_TO_CC[cc.toLowerCase()]=cc}

let searchTimeout=null;
function renderPlaceList(filter=''){
  const el=document.getElementById('place-list');
  const q=filter.trim();
  if(!q){
    // No search — show top 80 by population
    el.innerHTML=places.slice(0,80).map((p,i)=>{if(!p||!p.n)return'';return placeItem(i,p)}).join('');
    return;
  }

  const ql=q.toLowerCase();
  let cityQ=ql,countryQ='';

  // Support "city, country" syntax: "Springfield, IL" or "Mumbai, India"
  if(q.includes(',')){
    const parts=q.split(',').map(s=>s.trim().toLowerCase());
    cityQ=parts[0];
    countryQ=parts[1]||'';
  }

  // Resolve country query to code
  let countryCode=null;
  if(countryQ){
    countryCode=NAME_TO_CC[countryQ]||null;
    // Also try partial match: "unit" → "US" via "united states"
    if(!countryCode){
      for(const[name,cc]of Object.entries(NAME_TO_CC)){
        if(name.startsWith(countryQ)){countryCode=cc;break}
      }
    }
  }

  // Score and collect matches
  const results=[];
  for(let i=0;i<places.length&&results.length<150;i++){
    const p=places[i];
    if(!p||!p.n)continue;
    const nl=p.n.toLowerCase();
    const cName=(CC_NAMES[p.c]||'').toLowerCase();

    // If country filter specified, must match
    if(countryCode&&p.c!==countryCode)continue;

    // City name match
    let score=0;
    if(nl===cityQ)score=100;                         // exact match
    else if(nl.startsWith(cityQ))score=80;           // prefix match
    else if(nl.includes(cityQ))score=50;             // substring match
    else if(!countryQ){
      // Also match country name/code when no comma syntax
      if(p.c.toLowerCase()===ql)score=40;
      else if(cName.startsWith(ql))score=30;
      else if(cName.includes(ql))score=20;
      else continue;
    }else continue;

    // Boost by population (log scale) so big cities rank first among equal matches
    score+=Math.log10(Math.max(p.p,100))/10;
    results.push({idx:i,score});
  }

  // Sort by score desc, then pop desc
  results.sort((a,b)=>b.score-a.score||(places[b.idx].p-places[a.idx].p));
  const top=results.slice(0,100);

  const totalMatches=results.length;
  el.innerHTML=`<div style="padding:6px 18px;font-size:11px;color:var(--td);font-family:var(--mono)">${top.length<totalMatches?`Top ${top.length} of ${totalMatches.toLocaleString()}`:`${totalMatches}`} matches</div>`+
    top.map(r=>placeItem(r.idx,places[r.idx])).join('');
}

function placeItem(idx,p){
  const cName=CC_NAMES[p.c]||p.c;
  const popStr=p.p>1e6?(p.p/1e6).toFixed(1)+'M':p.p>1e3?(p.p/1e3).toFixed(0)+'K':p.p;
  return`<div class="pl-item" onclick="openCity(${idx})">
    <span class="pl-cc">${CC_FLAGS[p.c]||'🌍'}</span>
    <div style="flex:1;overflow:hidden"><div class="pl-name">${esc(p.n)}</div><div style="font-size:10px;color:var(--td)">${esc(cName)}</div></div>
    <span class="pl-pop">${popStr}</span>
  </div>`;
}

// Build the chip-grid + score detail panel for a single selected candidate.
// Used by both the city view and the river focus panel.
function renderSelectedCandHtml(){
  if(selectedCand===null||!activeCandidates[selectedCand])return'';
  const c=activeCandidates[selectedCand];
  const ss=[{l:'Generation',v:c.gen,c:'var(--gen)',w:'30%'},{l:'Flow',v:c.flow,c:'var(--flow)',w:'25%'},{l:'Impact',v:c.impact,c:'var(--imp)',w:'30%'},{l:'Feasibility',v:c.feas,c:'var(--feas)',w:'15%'}];
  return`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--td)">Score</div>
      <div style="font-family:var(--mono);font-size:28px;font-weight:700;color:var(--acc)">${c.composite}</div></div>
      <button class="close" onclick="clearSelectedCand()">×</button>
    </div>
    <div style="font-size:12px;font-weight:600;color:var(--tb);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px">${esc(c.stream||'Stream')}</div>
    <div style="font-size:10px;color:var(--td);font-family:var(--mono);margin-bottom:12px">${c.lat.toFixed(4)}, ${c.lon.toFixed(4)}</div>
    ${ss.map(s=>`<div class="ss-row"><div style="font-size:11px;font-weight:500;color:${s.c}">${s.l} <span style="font-size:9px;color:var(--td)">${s.w}</span></div><div class="ss-bar"><div class="ss-fill" style="width:${s.v}%;background:${s.c}"></div></div><div style="font-family:var(--mono);font-size:11px;text-align:right">${s.v}</div></div>`).join('')}
    <div class="pgrid">
      ${[['Pop',c.pop_d+'/km²'],['Imperv',c.imp_pct+'%'],['Velocity',c.vel+' m/s'],['Mean Q',c.mq+' cfs'],['Stream order',c.stream_order],['Catchment',c.catch_km2+' km²'],['EJ Index',c.ej],['Road',c.road_m+'m'],['Width',c.width_m+'m'],['Slope',c.slope_deg+'°'],['Waterway',c.waterway==='culvert_portal'?'⚠ Culvert portal':esc(c.waterway||'stream')],['Site type',c.isPortal?'Tunnel entrance':'Surface']].map(([l,v])=>`<div class="pchip"><div class="pchip-l">${l}</div><div class="pchip-v">${v}</div></div>`).join('')}
    </div>
    <div style="margin-top:10px;font-size:9.5px;line-height:1.5;color:var(--td);border-top:1px solid var(--bdr);padding-top:8px">
      ⓘ Explorer values are computed from <strong>OSM waterway geometry</strong> with GRIME's scoring model. The full 27-parameter pipeline is detailed in the <a href="../docs/" style="color:var(--acc)">Docs</a>.
    </div>
  </div>`;
}

function renderSelectedCandPanel(){
  const el=document.getElementById('site-detail');
  if(!el)return;
  const html=renderSelectedCandHtml();
  if(html){
    if(el._hideTimer){clearTimeout(el._hideTimer);el._hideTimer=null}
    el.innerHTML=html;
    requestAnimationFrame(()=>el.classList.add('vis'));
    return;
  }
  el.classList.remove('vis');
  if(el._hideTimer)clearTimeout(el._hideTimer);
  el._hideTimer=setTimeout(()=>{
    if(!el.classList.contains('vis'))el.innerHTML='';
    el._hideTimer=null;
  },520);
}

function renderRiverFocusHtml(){
  const segs=drawStreams.filter(s=>!s.underground&&riverKeyOf(s)===focusedRiverKey);
  const culvertSegs=drawStreams.filter(s=>s.underground&&riverKeyOf(s)===focusedRiverKey);
  let totalLenKm=0;
  for(const seg of segs)
    for(let i=1;i<seg.coords.length;i++)
      totalLenKm+=hvM(seg.coords[i-1][1],seg.coords[i-1][0],seg.coords[i][1],seg.coords[i][0])/1000;
  // Filter candidates by the riverKey baked in at scoring time
  const indexedCands=activeCandidates
    .map((c,i)=>({c,i,k:c.riverKey||riverKeyOf({baseName:c.stream,name:c.stream})}))
    .filter(x=>x.k===focusedRiverKey)
    .sort((a,b)=>b.c.composite-a.c.composite);
  const loading=riverFetchInFlight?`<div style="font-size:11px;color:var(--acc);font-family:var(--mono);margin-bottom:10px;display:flex;align-items:center;gap:8px"><span class="mini-spinner" style="display:inline-block;width:12px;height:12px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite"></span>Tracing whole river…</div>`:'';
  let html=`
    <button class="river-back" onclick="exitRiverFocus()">← Back to city view</button>
    <h3 style="font-size:14px;font-weight:600;color:var(--tb);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(focusedRiverName||'River')}</h3>
    <div style="font-family:var(--mono);font-size:10px;color:var(--td);margin-bottom:12px">RIVER FOCUS · ${segs.length} surface segment${segs.length===1?'':'s'}${culvertSegs.length?` · ${culvertSegs.length} culverted`:''}</div>
    ${loading}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px">
      <div class="pchip"><div class="pchip-l">Total length</div><div class="pchip-v">${totalLenKm<1?(totalLenKm*1000).toFixed(0)+' m':totalLenKm.toFixed(1)+' km'}</div></div>
      <div class="pchip"><div class="pchip-l">Net sites</div><div class="pchip-v">${indexedCands.length}</div></div>
    </div>
    <h3 style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--td);margin-bottom:8px">Top sites along this river</h3>
  `;
  if(indexedCands.length===0){
    html+=`<div style="font-size:11px;color:var(--td);padding:8px 0">${riverFetchInFlight?'Scoring...':'No scored sites along this stretch.'}</div>`;
  }else{
    html+=indexedCands.slice(0,30).map(({c,i},rank)=>{
      const rc=rank===0?'r1':rank===1?'r2':rank===2?'r3':'';
      const act=i===selectedCand?'active':'';
      return`<div class="cand-item ${act}" onclick="selectCand(${i})">
        <div class="rank ${rc}">${rank+1}</div>
        <div style="overflow:hidden"><div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.stream||'Stream')}</div><div style="font-size:10px;color:var(--td);font-family:var(--mono)">${c.lat.toFixed(4)}, ${c.lon.toFixed(4)}</div></div>
        <div style="font-family:var(--mono);font-size:14px;font-weight:700;text-align:right;color:${sc(c.composite)}">${c.composite}</div>
      </div>`;
    }).join('');
  }
  return html;
}

function renderCityView(){
  const el=document.getElementById('city-view');
  el.classList.add('vis');
  if(activeCityIdx<0)return;
  const p=places[activeCityIdx];
  if(!p)return;
  if(focusedRiverKey){el.innerHTML=renderRiverFocusHtml();renderSelectedCandPanel();return}
  let html=`<h3 style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--td);margin-bottom:6px">${esc(p.n||'Unknown')} · Top ${activeCandidates.length} sites</h3>`;
  if(pipelineStats){
    html+=`<div style="font-size:10px;color:var(--td);font-family:var(--mono);margin-bottom:12px;line-height:1.6">
      ${pipelineStats.scored} evaluated → ${pipelineStats.deployed} deployed (top ${Math.round(pipelineStats.pctile*100)}%)<br>
      ${pipelineStats.filtered} filtered · ${Math.round((pipelineStats.catchEff||.65)*100)}% catch rate · occlusion active${pipelineStats.portals?` · ${pipelineStats.portals} culvert portals`:''}
    </div>`;
  }

  html+=activeCandidates.slice(0,25).map((c,i)=>{
    const rc=i===0?'r1':i===1?'r2':i===2?'r3':'';
    const act=i===selectedCand?'active':'';
    return`<div class="cand-item ${act}" onclick="selectCand(${i})">
      <div class="rank ${rc}">${i+1}</div>
      <div style="overflow:hidden"><div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.stream||'Stream')}</div><div style="font-size:10px;color:var(--td);font-family:var(--mono)">${c.lat.toFixed(4)}, ${c.lon.toFixed(4)}</div></div>
      <div style="font-family:var(--mono);font-size:14px;font-weight:700;text-align:right;color:${sc(c.composite)}">${c.composite}</div>
    </div>`;
  }).join('');

  el.innerHTML=html;
  renderSelectedCandPanel();
}

// ═══ EVENTS ═════════════════════════════════════════════════════
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value;
  clearTimeout(searchTimeout);
  // If currently in city detail view, exit it so the search results are visible.
  // Otherwise the place list is hidden behind #city-view and typing appears to do nothing.
  if(activeCityIdx>=0){
    map.flyTo({center:[20,15],zoom:2,pitch:0,duration:1200});
    loadWorldView();
    document.getElementById('search').value=q;
    document.getElementById('search').focus();
  }
  searchTimeout=setTimeout(()=>renderPlaceList(q),150);
});
document.getElementById('back-btn').addEventListener('click',()=>{
  document.getElementById('search').value='';
  if(focusedRiverKey)exitRiverFocus();
  map.flyTo({center:[20,15],zoom:2,pitch:0,duration:1200});
  loadWorldView();
});

// Escape clears river focus first; pressing again at city view does nothing.
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(focusedRiverKey){exitRiverFocus();e.stopPropagation()}
    else if(selectedCand!==null){clearSelectedCand()}
  }
});
// ── Helper: pick correct map style from current state ──
function getMapStyle(){
  if(isSat)return'mapbox://styles/mapbox/satellite-streets-v12';
  return isLightTheme?'mapbox://styles/mapbox/light-v11':'mapbox://styles/mapbox/dark-v11';
}
// Coalesce rapid style reloads. Firing map.setStyle() again while the previous style
// is still rebuilding tears down in-flight sprite/image requests ("Could not load
// image…" console errors) and wastes work. If a reload is in flight, just mark one
// pending; when it lands we re-apply the latest desired style (getMapStyle() reads the
// current isSat / isLightTheme), so a flurry of toggles collapses to the final state.
// Coalesce on OUR OWN in-flight reload only (an explicit flag, deliberately not
// map.isStyleLoaded(): that is also false while mere tiles load, which would
// swallow a toggle clicked during any flyTo and never apply it).
// currentMapStyle guards against a SAME-style setStyle (theme toggle while
// satellite is on): Mapbox would diff-apply it — stripping our runtime layers —
// and never fire 'style.load', stranding styleReloadInFlight forever. When the
// target equals what's already loaded there is nothing to do at all. Every real
// transition here swaps sprites (satellite ↔ dark ↔ light), so the diff bails
// to a full rebuild and 'style.load' is guaranteed.
let styleReloadPending=false,styleReloadInFlight=false,currentMapStyle=null;
function reloadMap(){
  const target=getMapStyle();
  if(target===currentMapStyle)return;   // e.g. theme toggled while satellite shows
  if(styleReloadInFlight){styleReloadPending=true;return;}
  styleReloadInFlight=true;
  currentMapStyle=target;
  map.setStyle(target);
  map.once('style.load',()=>{
    styleReloadInFlight=false;
    if(wwOverlayOn)addWaterwayOverlay();
    if(activeCityIdx>=0)openCity(activeCityIdx);else loadWorldView();
    if(styleReloadPending){styleReloadPending=false;reloadMap();}
  });
}

// ── Satellite: on/off overlay (independent of theme) ──
document.getElementById('style-toggle').addEventListener('click',()=>{
  isSat=!isSat;
  document.getElementById('style-toggle').textContent=isSat?'Satellite ✓':'Satellite';
  document.getElementById('style-toggle').classList.toggle('active',isSat);
  reloadMap();
});

// ── Waterway overlay: OSM tiles showing real rivers ──
let wwOverlayOn=false;
function addWaterwayOverlay(){
  if(map.getSource('osm-ww'))return;
  // Toggling the overlay during a style reload throws "Style is not done loading" —
  // the wrapper re-runs on style.load (getSource guard keeps it idempotent; stale
  // once the user has toggled the overlay back off).
  withWritableStyle(()=>{
    if(map.getSource('osm-ww'))return;
    map.addSource('osm-ww',{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'});
    map.addLayer({id:'osm-ww-layer',type:'raster',source:'osm-ww',paint:{'raster-opacity':0.35}},
      map.getLayer('streams-outline')?'streams-outline':map.getLayer('clusters')?'clusters':undefined);
  },()=>wwOverlayOn);
}
function removeWaterwayOverlay(){
  try{map.removeLayer('osm-ww-layer')}catch(e){}
  try{map.removeSource('osm-ww')}catch(e){}
}

document.getElementById('ww-toggle').addEventListener('click',()=>{
  wwOverlayOn=!wwOverlayOn;
  const btn=document.getElementById('ww-toggle');
  btn.classList.toggle('active',wwOverlayOn);
  if(wwOverlayOn)addWaterwayOverlay();else removeWaterwayOverlay();
});

// ── Theme: dark ↔ light (switches BOTH UI chrome and earth map) ──
let isLightTheme=false;
document.getElementById('theme-toggle').addEventListener('click',()=>{
  isLightTheme=!isLightTheme;
  document.body.classList.toggle('theme-light',isLightTheme);
  document.getElementById('theme-toggle').textContent=isLightTheme?'Dark theme':'Light theme';
  reloadMap(); // always switch map to match — dark earth or light earth (unless satellite is on, then no change needed)
});

// ═══ INIT ═══════════════════════════════════════════════════════
async function init(){
  // No usable map (missing token / init failure) → a terminal error state is
  // already shown by initMap(); stop before touching the (undefined) map.
  if(!await initMap())return;
  document.getElementById('load-msg').textContent='Loading cities database...';
  places=await loadPlaces();
  places=places.filter(p=>p&&p.n&&p.c&&p.la!=null&&p.lo!=null);
  const n=places.length.toLocaleString();
  const cc=new Set(places.map(p=>p.c)).size;
  document.getElementById('load-msg').textContent=`${n} cities loaded`;
  document.getElementById('search').placeholder=`Search ${n} cities across ${cc} countries...`;
  document.getElementById('loading').style.display='none';
  document.getElementById('app').classList.add('ready');
  map.resize();
  // The map's `load` event can fire while we're still awaiting loadPlaces() above
  // (common on a cold reload: the Mapbox style loads from CDN faster than the large
  // places.json downloads). A `load` listener attached after the event has already
  // fired never runs, so loadWorldView() would be skipped and no cities/dots appear.
  // Guard by checking whether the map has already loaded.
  if(map.loaded())loadWorldView();
  else map.on('load',()=>loadWorldView());
}
init();
</script>
